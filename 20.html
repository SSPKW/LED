<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>加減法大挑戰 - 動物生態與龍虎榜</title>
    <!-- 載入 Tailwind CSS、Canvas Confetti 與 Matter.js 物理引擎 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            overscroll-behavior: none;
            user-select: none;
        }
        
        /* 彈出與震動動畫 */
        .pop-in {
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }

        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        #game-zone canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 0.75rem;
        }

        /* 自訂捲軸樣式 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.5);
            border-radius: 999px;
        }
    </style>
</head>
<body class="bg-blue-50 h-screen flex flex-col overflow-hidden">

    <!-- 主要內容區：左側數學問答 + 右側動物生態地圖 -->
    <div class="flex-1 overflow-y-auto flex flex-col md:flex-row w-full max-w-7xl mx-auto p-2 sm:p-3 gap-3 sm:gap-4 min-h-0">
        
        <!-- 左側：數學問答區 -->
        <div class="w-full md:w-5/12 bg-white rounded-2xl shadow-xl flex flex-col p-3 sm:p-4 relative z-10 border-4 border-blue-200 shrink-0">
            <!-- 倒數計時能量條 -->
            <div class="w-full bg-gray-200 rounded-full h-4 mb-3 flex-shrink-0 relative overflow-hidden shadow-inner">
                <div id="time-bar" class="bg-green-500 h-4 rounded-full transition-all duration-1000 ease-linear w-full"></div>
            </div>
            
            <!-- 道具技能列：暫停與提示 -->
            <div class="flex justify-between items-center mb-3 gap-2 flex-shrink-0">
                <button id="pause-btn" onclick="usePause()" class="flex-1 bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold py-2 px-2 rounded-xl shadow-[0_4px_0_rgb(161,98,7)] active:shadow-[0_0px_0_rgb(161,98,7)] active:translate-y-1 transition-all text-xs sm:text-sm flex items-center justify-center gap-1 opacity-50 cursor-not-allowed">
                    ⏳ 諗緊 <span class="text-xs">(需🐘x1)</span>
                </button>
                <button id="hint-btn" onclick="useHint()" class="flex-1 bg-purple-400 hover:bg-purple-500 text-purple-900 font-bold py-2 px-2 rounded-xl shadow-[0_4px_0_rgb(107,33,168)] active:shadow-[0_0px_0_rgb(107,33,168)] active:translate-y-1 transition-all text-xs sm:text-sm flex items-center justify-center gap-1 opacity-50 cursor-not-allowed">
                    💡 提示 <span class="text-xs">(需🐘x2)</span>
                </button>
            </div>

            <!-- 智能解題提示區 -->
            <div id="hint-text" class="hidden mb-3 p-2.5 bg-purple-100 text-purple-800 rounded-xl text-xs sm:text-sm font-bold border-2 border-purple-300 flex-shrink-0">
                <!-- 提示內容動態顯示 -->
            </div>

            <!-- 題目顯示區 -->
            <div id="question-container" class="flex-1 flex flex-col items-center justify-center mb-3 min-h-[76px] bg-slate-50 rounded-2xl border-2 border-slate-100 px-2">
                <div id="question-text" class="text-4xl sm:text-5xl md:text-6xl font-black text-gray-700 tracking-wider text-center flex items-center justify-center flex-wrap gap-2">
                    <span class="text-xl sm:text-2xl text-slate-400 font-bold">按「開始新遊戲」挑戰！</span>
                </div>
            </div>

            <!-- 數字鍵盤 -->
            <div class="grid grid-cols-3 gap-2 w-full max-w-sm mx-auto flex-shrink-0">
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-2xl sm:text-3xl font-bold py-2.5 sm:py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(1)">1</button>
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-2xl sm:text-3xl font-bold py-2.5 sm:py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(2)">2</button>
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-2xl sm:text-3xl font-bold py-2.5 sm:py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(3)">3</button>
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-2xl sm:text-3xl font-bold py-2.5 sm:py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(4)">4</button>
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-2xl sm:text-3xl font-bold py-2.5 sm:py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(5)">5</button>
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-2xl sm:text-3xl font-bold py-2.5 sm:py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(6)">6</button>
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-2xl sm:text-3xl font-bold py-2.5 sm:py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(7)">7</button>
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-2xl sm:text-3xl font-bold py-2.5 sm:py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(8)">8</button>
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-2xl sm:text-3xl font-bold py-2.5 sm:py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(9)">9</button>
                
                <button class="bg-red-100 hover:bg-red-200 text-red-600 text-xl sm:text-2xl font-bold py-2.5 sm:py-3 rounded-xl shadow-[0_4px_0_rgb(252,165,165)] active:shadow-[0_0px_0_rgb(252,165,165)] active:translate-y-1 transition-all" onclick="clearInput()">清除</button>
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-2xl sm:text-3xl font-bold py-2.5 sm:py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(0)">0</button>
                <button class="bg-green-500 hover:bg-green-600 text-white text-xl sm:text-2xl font-bold py-2.5 sm:py-3 rounded-xl shadow-[0_4px_0_rgb(21,128,61)] active:shadow-[0_0px_0_rgb(21,128,61)] active:translate-y-1 transition-all" onclick="checkAnswer()">確定</button>
            </div>
        </div>

        <!-- 右側：動物生態地圖區 (Matter.js RTS 視角) -->
        <div id="game-zone" class="w-full md:w-7/12 min-h-[260px] md:min-h-0 rounded-2xl shadow-xl relative overflow-hidden border-4 border-green-400 bg-green-200">
            <div id="canvas-container" class="w-full h-full"></div>
            
            <!-- 右上角生態圖例提示 -->
            <div class="absolute top-2 right-2 bg-white/80 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-bold text-slate-700 shadow pointer-events-none">
                連對進化：🐭→🐱→🐶→🐆→🐅→🦁→🐘 (20題🦄)
            </div>

            <!-- 遊戲開始覆蓋層 -->
            <div id="game-overlay" class="absolute inset-0 bg-white/85 flex flex-col items-center justify-center z-30 backdrop-blur-sm p-4 text-center">
                <div class="text-5xl mb-2">🦁🐘🦄</div>
                <h2 class="text-2xl sm:text-3xl font-black text-slate-800 mb-2">準備好建造動物樂園了嗎？</h2>
                <p class="text-sm sm:text-base text-slate-600 font-bold mb-6 max-w-md">
                    每局擁有 <span class="text-red-500">❤️❤️❤️❤️❤️ 5次機會</span>，答對越多、連對越高，就能登上 Top 10 龍虎榜！
                </p>
                <div class="flex flex-col sm:flex-row gap-3">
                    <button onclick="startGame()" class="bg-gradient-to-r from-blue-500 to-purple-600 text-white text-xl sm:text-2xl font-black py-3.5 px-8 rounded-full shadow-xl hover:scale-105 transition-transform border-4 border-white">
                        ▶️ 開始新遊戲
                    </button>
                    <button onclick="openLeaderboard()" class="bg-gradient-to-r from-amber-400 to-orange-500 text-white text-xl sm:text-2xl font-black py-3.5 px-8 rounded-full shadow-xl hover:scale-105 transition-transform border-4 border-white">
                        🏆 龍虎榜
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部：狀態列與功能按鈕 -->
    <div class="w-full bg-slate-800 text-white py-2.5 px-3 sm:px-6 shadow-lg z-40 rounded-t-3xl mt-1 flex flex-wrap justify-between items-center gap-2 shrink-0">
        <div class="flex items-center gap-2">
            <h1 class="text-base sm:text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-500">🌟 加減法大挑戰</h1>
            <span id="lives-display" class="text-sm sm:text-lg tracking-normal sm:tracking-wider bg-slate-700/80 px-2.5 py-0.5 rounded-full" title="剩餘機會">❤️❤️❤️❤️❤️</span>
        </div>

        <!-- 即時成績數據 -->
        <div class="flex items-center gap-3 sm:gap-5 text-xs sm:text-base font-bold bg-slate-700 py-1 px-3 sm:px-4 rounded-full">
            <div>總對: <span id="correct-score" class="text-green-400 text-base sm:text-xl">0</span></div>
            <div>連對: <span id="streak-score" class="text-yellow-400 text-base sm:text-xl">0</span> <span class="text-xs text-slate-300">(最高:<span id="max-streak-score">0</span>)</span></div>
            <div title="可用於暫停或提示">🐘: <span id="elephant-score" class="text-pink-400 text-base sm:text-xl">0</span></div>
        </div>

        <!-- 龍虎榜與結束按鈕 -->
        <div class="flex items-center gap-2">
            <button onclick="openLeaderboard()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-black py-1.5 px-3 rounded-xl text-xs sm:text-sm shadow transition-all flex items-center gap-1">
                🏆 龍虎榜
            </button>
            <button id="end-game-btn" onclick="triggerManualEnd()" class="hidden bg-rose-500 hover:bg-rose-600 text-white font-bold py-1.5 px-3 rounded-xl text-xs sm:text-sm shadow transition-all">
                🏁 結束並記錄
            </button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 彈窗 1：遊戲完結與輸入使用者名稱 Modal      -->
    <!-- ========================================== -->
    <div id="gameover-modal" class="hidden fixed inset-0 bg-slate-900/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border-4 border-yellow-400 pop-in text-center relative">
            <div id="gameover-badge" class="text-6xl mb-2">🎉</div>
            <h2 id="gameover-title" class="text-2xl sm:text-3xl font-black text-slate-800 mb-1">挑戰完結！</h2>
            <p id="top10-congrats" class="hidden text-sm font-black text-amber-600 bg-amber-100 py-1 px-3 rounded-full inline-block mb-3">
                ✨ 太厲害了！你的成績打入龍虎榜頭 10 名！
            </p>

            <!-- 本局成績卡片 -->
            <div class="grid grid-cols-2 gap-3 my-4">
                <div class="bg-green-50 border-2 border-green-200 rounded-2xl p-3">
                    <div class="text-xs sm:text-sm font-bold text-green-700">總答對題數</div>
                    <div id="final-correct" class="text-3xl sm:text-4xl font-black text-green-600 mt-1">0</div>
                </div>
                <div class="bg-yellow-50 border-2 border-yellow-200 rounded-2xl p-3">
                    <div class="text-xs sm:text-sm font-bold text-yellow-700">最高連對紀錄</div>
                    <div id="final-max-streak" class="text-3xl sm:text-4xl font-black text-yellow-600 mt-1">0</div>
                </div>
            </div>

            <!-- 輸入玩家名稱表單 -->
            <div class="text-left mb-4">
                <label for="player-name-input" class="block text-sm font-black text-slate-700 mb-1.5">
                    ✍️ 輸入玩家名稱登上龍虎榜：
                </label>
                <input 
                    type="text" 
                    id="player-name-input" 
                    maxlength="12" 
                    placeholder="例如：陳小明 / 數學小超人" 
                    class="w-full px-4 py-3 text-lg font-bold text-slate-800 bg-slate-50 border-2 border-blue-300 rounded-xl focus:outline-none focus:border-blue-500 focus:bg-white transition-all"
                    onkeydown="handleNameInputKey(event)"
                >
                <p id="name-error-msg" class="hidden text-xs font-bold text-rose-500 mt-1">⚠️ 請先輸入玩家名稱再儲存喔！</p>

                <!-- 最近使用過的玩家名稱快速選單（方便班房共用平板點選） -->
                <div id="recent-names-container" class="hidden mt-2">
                    <span class="text-xs font-bold text-slate-400 block mb-1">快速選擇曾用名稱：</span>
                    <div id="recent-names-list" class="flex flex-wrap gap-1.5"></div>
                </div>
            </div>

            <!-- 操作按鈕 -->
            <div class="flex flex-col gap-2">
                <button onclick="savePlayerRecord()" class="w-full bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white text-lg font-black py-3.5 rounded-xl shadow-lg active:translate-y-0.5 transition-all">
                    💾 儲存成績並查看龍虎榜
                </button>
                <button onclick="skipAndRestart()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 text-sm font-bold py-2.5 rounded-xl transition-all">
                    跳過記錄，直接開始新遊戲
                </button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 彈窗 2：Top 10 龍虎榜 Modal                -->
    <!-- ========================================== -->
    <div id="leaderboard-modal" class="hidden fixed inset-0 bg-slate-900/75 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-4">
        <div class="bg-white rounded-3xl max-w-xl w-full p-5 sm:p-6 shadow-2xl border-4 border-amber-400 pop-in flex flex-col max-h-[90vh]">
            <!-- 標題列 -->
            <div class="flex justify-between items-center mb-3 shrink-0">
                <div class="flex items-center gap-2">
                    <span class="text-3xl">🏆</span>
                    <div>
                        <h2 class="text-xl sm:text-2xl font-black text-slate-800">加減法龍虎榜 (Top 10)</h2>
                        <p class="text-xs font-bold text-slate-500">記錄最強小數學家的連對與總對戰績</p>
                    </div>
                </div>
                <button onclick="closeLeaderboard()" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-black flex items-center justify-center text-lg">
                    ✕
                </button>
            </div>

            <!-- 排序切換分頁：總答對優先 vs 最高連對優先 -->
            <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1.5 rounded-xl mb-3 shrink-0">
                <button id="sort-total-btn" onclick="switchLeaderboardSort('total')" class="py-2 px-3 rounded-lg text-xs sm:text-sm font-black bg-white text-blue-600 shadow transition-all">
                    📊 總答對優先 (總對 ➔ 連對)
                </button>
                <button id="sort-streak-btn" onclick="switchLeaderboardSort('streak')" class="py-2 px-3 rounded-lg text-xs sm:text-sm font-black text-slate-500 hover:text-slate-700 transition-all">
                    🔥 最高連對優先 (連對 ➔ 總對)
                </button>
            </div>

            <!-- 排行榜列表區 -->
            <div class="flex-1 overflow-y-auto min-h-[220px] pr-1">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-xs font-black text-slate-400 border-b-2 border-slate-100">
                            <th class="py-2 px-2 w-14 text-center">名次</th>
                            <th class="py-2 px-2">玩家名稱</th>
                            <th class="py-2 px-2 text-center">總答對</th>
                            <th class="py-2 px-2 text-center">最高連對</th>
                            <th class="py-2 px-2 text-right hidden sm:table-cell">日期</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-tbody" class="divide-y divide-slate-100 text-sm sm:text-base font-bold">
                        <!-- 由 JS 動態渲染 Top 10 紀錄 -->
                    </tbody>
                </table>
            </div>

            <!-- 底部操作按鈕 -->
            <div class="mt-4 pt-3 border-t border-slate-100 flex flex-wrap justify-between items-center gap-2 shrink-0">
                <button id="clear-board-btn" onclick="handleClearLeaderboard()" class="text-xs font-bold text-rose-500 hover:text-rose-700 py-2 px-3 rounded-lg hover:bg-rose-50 transition-all">
                    🗑️ 清除排行榜
                </button>
                <div class="flex gap-2">
                    <button onclick="closeLeaderboard()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2.5 px-5 rounded-xl text-sm transition-all">
                        關閉
                    </button>
                    <button onclick="closeLeaderboard(); startGame();" class="bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 text-white font-black py-2.5 px-5 rounded-xl text-sm shadow transition-all">
                        ▶️ 開始新遊戲
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 音效系統 (Web Audio API 合成音效)
        // ==========================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playCoinSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(987.77, audioCtx.currentTime); 
            oscillator.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.1); 
            gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.45);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.45);
        }

        function playErrorSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playGameOverFanfare() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.12);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime + idx * 0.12);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.12 + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + idx * 0.12);
                osc.stop(audioCtx.currentTime + idx * 0.12 + 0.4);
            });
        }

        // ==========================================
        // 2. 遊戲核心狀態變數
        // ==========================================
        let currentQuestion = {};
        let currentInput = "";
        let timer = null;
        let timeLeft = 15;
        let maxTime = 15;
        let isPaused = false;
        let isPlaying = false;
        let isProcessingAnswer = false;

        // 成績與生命值統計
        const MAX_LIVES = 5;
        let lives = MAX_LIVES;
        let qCount = 0;
        let totalCorrect = 0;
        let currentStreak = 0;
        let maxStreak = 0;
        let elephantCount = 0;

        // 龍虎榜相關狀態
        const STORAGE_KEY = 'math_challenge_top10_records_v1';
        let currentSortMode = 'total'; // 'total' (總答對優先) 或 'streak' (最高連對優先)
        let lastSavedRecordId = null;
        let clearConfirmTimeout = null;
        let clearConfirmPending = false;
        let manualEndConfirmPending = false;
        let manualEndTimeout = null;
        let pausedByModal = false;

        // ==========================================
        // 3. Matter.js 動物生態物理引擎
        // ==========================================
        const Engine = Matter.Engine,
              Render = Matter.Render,
              Runner = Matter.Runner,
              Bodies = Matter.Bodies,
              Composite = Matter.Composite,
              Mouse = Matter.Mouse,
              MouseConstraint = Matter.MouseConstraint,
              Events = Matter.Events;

        let engine, render, runner, world;
        let animalBodies = [];
        let terrainBodies = [];
        let animalAIInterval = null;

        const CAT_WALL = 0x0001;
        const CAT_FOREST = 0x0002;
        const CAT_WATER = 0x0004;
        const CAT_ELEPHANT = 0x0008;
        const CAT_FELINE = 0x0010;
        const CAT_OTHER = 0x0020;

        function initPhysics() {
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth || 600;
            const height = container.clientHeight || 400;

            engine = Engine.create();
            world = engine.world;
            engine.gravity.y = 0;
            engine.gravity.x = 0;

            render = Render.create({
                element: container,
                engine: engine,
                options: {
                    width: width,
                    height: height,
                    wireframes: false,
                    background: 'transparent'
                }
            });

            const wallOptions = { 
                isStatic: true, 
                render: { fillStyle: 'transparent' },
                collisionFilter: { category: CAT_WALL }
            };
            Composite.add(world, [
                Bodies.rectangle(width/2, -50, width+200, 100, wallOptions),
                Bodies.rectangle(width/2, height+50, width+200, 100, wallOptions),
                Bodies.rectangle(-50, height/2, 100, height+200, wallOptions),
                Bodies.rectangle(width+50, height/2, 100, height+200, wallOptions)
            ]);

            generateTerrain(width, height);

            const mouse = Mouse.create(render.canvas);
            const mouseConstraint = MouseConstraint.create(engine, {
                mouse: mouse,
                constraint: { stiffness: 0.2, render: { visible: false } }
            });
            Composite.add(world, mouseConstraint);
            render.mouse = mouse;

            Events.on(render, 'afterRender', function() {
                const ctx = render.context;
                
                // 繪製森林與湖泊生態地形
                terrainBodies.forEach(b => {
                    let r = b.baseRadius;
                    if (b.isForest) {
                        ctx.font = `${r * 0.6}px Arial`;
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText('🌲', b.position.x - r*0.4, b.position.y - r*0.3);
                        ctx.fillText('🌳', b.position.x + r*0.4, b.position.y + r*0.2);
                        ctx.fillText('🍄', b.position.x + r*0.1, b.position.y - r*0.5);
                    }
                    if (b.isWater) {
                        ctx.font = `${r * 0.55}px Arial`;
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText('🌊', b.position.x, b.position.y);
                        ctx.fillText('🐟', b.position.x - r*0.4, b.position.y + r*0.3);
                        ctx.fillText('🦆', b.position.x + r*0.3, b.position.y - r*0.3);
                    }
                });

                // 繪製動物角色與獨角獸彩虹尾跡
                animalBodies.forEach(body => {
                    if (body.isUnicorn) {
                        if (!body.trail) body.trail = [];
                        body.trail.unshift({ x: body.position.x, y: body.position.y });
                        if (body.trail.length > 20) body.trail.pop();
                        ctx.beginPath();
                        for (let i = 0; i < body.trail.length - 1; i++) {
                            ctx.moveTo(body.trail[i].x, body.trail[i].y);
                            ctx.lineTo(body.trail[i+1].x, body.trail[i+1].y);
                        }
                        ctx.lineWidth = 14;
                        ctx.strokeStyle = `hsla(${Date.now() % 360}, 100%, 60%, 0.5)`;
                        ctx.lineCap = 'round';
                        ctx.stroke();
                    }

                    ctx.font = `${body.circleRadius * 1.5}px Arial`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    
                    let alpha = 1;
                    if (Date.now() - body.creationTime < 800) {
                        alpha = (Date.now() - body.creationTime) / 800;
                    }
                    ctx.globalAlpha = alpha;
                    
                    ctx.translate(body.position.x, body.position.y);
                    if (body.velocity.x < -0.1) ctx.scale(-1, 1);
                    
                    ctx.beginPath();
                    ctx.arc(0, 0, body.circleRadius * 1.1, 0, 2 * Math.PI);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                    ctx.fill();

                    ctx.fillText(body.emoji, 0, 0);
                    ctx.setTransform(1, 0, 0, 1, 0, 0);
                    ctx.globalAlpha = 1;
                });
            });

            Render.run(render);
            runner = Runner.create();
            Runner.run(runner, engine);
            
            startAnimalAI();
        }

        function generateTerrain(w, h) {
            terrainBodies.forEach(b => Matter.World.remove(world, b));
            terrainBodies = [];

            for(let i = 0; i < 2; i++) {
                let r = Math.random() * 25 + 38;
                let sides = Math.floor(Math.random() * 4) + 5;
                let body = Bodies.polygon(Math.random()*(w-r*4)+r*2, Math.random()*(h-r*4)+r*2, sides, r, {
                    isStatic: true, isForest: true,
                    chamfer: { radius: r * 0.35 },
                    render: { fillStyle: 'rgba(34, 139, 34, 0.35)', strokeStyle: 'transparent' },
                    collisionFilter: { category: CAT_FOREST, mask: CAT_ELEPHANT }
                });
                Matter.Body.scale(body, 1 + Math.random() * 0.6, 1 + Math.random() * 0.6);
                body.baseRadius = r;
                terrainBodies.push(body);
                Composite.add(world, body);
            }
            for(let i = 0; i < 2; i++) {
                let r = Math.random() * 25 + 38;
                let sides = Math.floor(Math.random() * 4) + 5;
                let body = Bodies.polygon(Math.random()*(w-r*4)+r*2, Math.random()*(h-r*4)+r*2, sides, r, {
                    isStatic: true, isWater: true,
                    chamfer: { radius: r * 0.35 },
                    render: { fillStyle: 'rgba(64, 164, 255, 0.35)', strokeStyle: 'transparent' },
                    collisionFilter: { category: CAT_WATER, mask: CAT_FELINE }
                });
                Matter.Body.scale(body, 1 + Math.random() * 0.6, 1 + Math.random() * 0.6);
                body.baseRadius = r;
                terrainBodies.push(body);
                Composite.add(world, body);
            }
        }

        function addAnimal() {
            if (!engine) return;
            const container = document.getElementById('canvas-container');
            const w = container.clientWidth;
            const h = container.clientHeight;

            let emoji, radius, category, mask;
            let isUnicorn = false;
            let isElephant = false;

            if (totalCorrect === 20) {
                emoji = '🦄'; radius = 35; isUnicorn = true;
                category = CAT_OTHER;
                mask = CAT_WALL | CAT_ELEPHANT | CAT_FELINE | CAT_OTHER; 
            } else if (currentStreak >= 7) {
                emoji = '🐘'; radius = 31.5; isElephant = true;
                category = CAT_ELEPHANT;
                mask = CAT_WALL | CAT_FOREST | CAT_ELEPHANT | CAT_FELINE | CAT_OTHER;
            } else if (currentStreak === 6) {
                emoji = '🦁'; radius = 24.5; category = CAT_FELINE; mask = CAT_WALL | CAT_WATER | CAT_ELEPHANT | CAT_FELINE | CAT_OTHER;
            } else if (currentStreak === 5) {
                emoji = '🐅'; radius = 23; category = CAT_FELINE; mask = CAT_WALL | CAT_WATER | CAT_ELEPHANT | CAT_FELINE | CAT_OTHER;
            } else if (currentStreak === 4) {
                emoji = '🐆'; radius = 21; category = CAT_FELINE; mask = CAT_WALL | CAT_WATER | CAT_ELEPHANT | CAT_FELINE | CAT_OTHER;
            } else if (currentStreak === 3) {
                emoji = '🐶'; radius = 19.5; category = CAT_OTHER; mask = CAT_WALL | CAT_ELEPHANT | CAT_FELINE | CAT_OTHER;
            } else if (currentStreak === 2) {
                emoji = '🐱'; radius = 17.5; category = CAT_FELINE; mask = CAT_WALL | CAT_WATER | CAT_ELEPHANT | CAT_FELINE | CAT_OTHER;
            } else {
                emoji = '🐭'; radius = 14; category = CAT_OTHER; mask = CAT_WALL | CAT_ELEPHANT | CAT_FELINE | CAT_OTHER;
            }

            if (isElephant) {
                elephantCount++;
                updateScores();
            }

            const body = Bodies.circle(Math.random()*(w-100)+50, Math.random()*(h-100)+50, radius, {
                restitution: isUnicorn ? 1.0 : 0.2,
                friction: 0.1,
                frictionAir: 0.05,
                mass: isUnicorn ? 50 : (isElephant ? 30 : radius), 
                collisionFilter: { category: category, mask: mask },
                render: { visible: false }, 
            });

            body.emoji = emoji;
            body.isUnicorn = isUnicorn;
            body.isElephant = isElephant;
            body.creationTime = Date.now();
            
            animalBodies.push(body);
            Composite.add(world, body);
        }

        function startAnimalAI() {
            if (animalAIInterval) clearInterval(animalAIInterval);
            animalAIInterval = setInterval(() => {
                animalBodies.forEach(block => {
                    if (block.isUnicorn) {
                        if (Date.now() - block.creationTime < 2000) return;
                        if (Math.random() < 0.5) {
                            let forceMag = 0.08 * block.mass; 
                            let angle = Math.random() * Math.PI * 2; 
                            Matter.Body.applyForce(block, block.position, {
                                x: Math.cos(angle) * forceMag, 
                                y: Math.sin(angle) * forceMag
                            });
                        }
                    } else {
                        if (Math.random() < 0.25) { 
                            let forceMag = 0.01 * block.mass;
                            let angle = Math.random() * Math.PI * 2; 
                            Matter.Body.applyForce(block, block.position, {
                                x: Math.cos(angle) * forceMag, 
                                y: Math.sin(angle) * forceMag
                            });
                        }
                    }
                });
            }, 200); 
        }

        function removeLastAnimal() {
            if (!engine || animalBodies.length === 0) return;
            for (let i = animalBodies.length - 1; i >= 0; i--) {
                if (!animalBodies[i].isUnicorn) {
                    const blockToRemove = animalBodies[i];
                    if (blockToRemove.isElephant) elephantCount--;
                    Matter.World.remove(world, blockToRemove);
                    animalBodies.splice(i, 1);
                    updateScores();
                    return;
                }
            }
        }

        function resetAllAnimals() {
            if (!world) return;
            animalBodies.forEach(b => Matter.World.remove(world, b));
            animalBodies = [];
            elephantCount = 0;
        }

        // ==========================================
        // 4. 遊戲流程控制 (開始、答題、扣血、完結)
        // ==========================================
        function startGame() {
            document.getElementById('game-overlay').classList.add('hidden');
            document.getElementById('gameover-modal').classList.add('hidden');
            document.getElementById('end-game-btn').classList.remove('hidden');
            resetManualEndButton();

            isPlaying = true;
            isProcessingAnswer = false;
            lives = MAX_LIVES;
            qCount = 0;
            totalCorrect = 0;
            currentStreak = 0;
            maxStreak = 0;
            elephantCount = 0;
            
            if (!engine) {
                initPhysics();
            } else {
                resetAllAnimals();
                const container = document.getElementById('canvas-container');
                generateTerrain(container.clientWidth, container.clientHeight);
            }

            updateScores();
            nextQuestion();
        }

        function updateScores() {
            document.getElementById('correct-score').innerText = totalCorrect;
            document.getElementById('streak-score').innerText = currentStreak;
            document.getElementById('max-streak-score').innerText = maxStreak;
            document.getElementById('elephant-score').innerText = elephantCount;

            // 更新愛心生命值顯示
            let hearts = '';
            for (let i = 0; i < MAX_LIVES; i++) {
                hearts += i < lives ? '❤️' : '🖤';
            }
            document.getElementById('lives-display').innerText = hearts;

            updateButtonsUI();
        }

        function updateButtonsUI() {
            const pauseBtn = document.getElementById('pause-btn');
            const hintBtn = document.getElementById('hint-btn');
            
            if (isPlaying && elephantCount >= 1 && !isPaused) {
                pauseBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                pauseBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
            
            if (isPlaying && elephantCount >= 2 && !isPaused) {
                hintBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                hintBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        function generateQuestion() {
            qCount++;
            let q = {};
            let requiresBorrow = false;

            if (qCount % 4 === 0) {
                if (Math.random() < 0.5) {
                    q.type = 'chain'; q.op = Math.random() < 0.5 ? '+' : '-';
                    if (q.op === '+') {
                        q.num1 = Math.floor(Math.random() * 8) + 1;
                        q.num2 = Math.floor(Math.random() * 8) + 1;
                        q.num3 = Math.floor(Math.random() * 6) + 1;
                        q.answer = q.num1 + q.num2 + q.num3;
                        q.text = `${q.num1} + ${q.num2} + ${q.num3} = `;
                    } else {
                        q.num1 = Math.floor(Math.random() * 6) + 14; 
                        q.num2 = Math.floor(Math.random() * 6) + 1;
                        q.num3 = Math.floor(Math.random() * 5) + 1;
                        q.answer = q.num1 - q.num2 - q.num3;
                        q.text = `${q.num1} - ${q.num2} - ${q.num3} = `;
                        if (q.num1 % 10 < q.num2) requiresBorrow = true;
                    }
                } else {
                    q.type = 'algebra'; q.op = Math.random() < 0.5 ? '+' : '-';
                    if (q.op === '+') {
                        q.num1 = Math.floor(Math.random() * 10) + 1;
                        q.answer = Math.floor(Math.random() * 10) + 1;
                        q.result = q.num1 + q.answer;
                        if (Math.random() < 0.5) { q.text = `${q.num1} + _ = ${q.result}`; q.blankPos = 2; } 
                        else { q.text = `_ + ${q.num1} = ${q.result}`; q.blankPos = 1; }
                    } else {
                        q.result = Math.floor(Math.random() * 9) + 1; 
                        q.answer = Math.floor(Math.random() * 9) + 1; 
                        q.num1 = q.result + q.answer; 
                        if (Math.random() < 0.5) { 
                            q.text = `${q.num1} - _ = ${q.result}`; 
                            q.blankPos = 2; 
                        } else { 
                            q.text = `_ - ${q.answer} = ${q.result}`; 
                            q.blankPos = 1; 
                            q.answer = q.num1; 
                        }
                    }
                }
            } else {
                q.type = 'normal'; q.op = Math.random() < 0.5 ? '+' : '-';
                if (q.op === '+') {
                    q.num1 = Math.floor(Math.random() * 19) + 1;
                    q.num2 = Math.floor(Math.random() * (20 - q.num1)) + 1;
                    q.answer = q.num1 + q.num2;
                    q.text = `${q.num1} + ${q.num2} = `;
                } else {
                    q.num1 = Math.floor(Math.random() * 10) + 11;
                    q.num2 = Math.floor(Math.random() * 10) + 1; 
                    if (q.num1 < q.num2) { let temp = q.num1; q.num1 = q.num2; q.num2 = temp; }
                    q.answer = q.num1 - q.num2;
                    q.text = `${q.num1} - ${q.num2} = `;
                    if (q.num1 % 10 < q.num2) requiresBorrow = true;
                }
            }

            maxTime = (requiresBorrow || (q.type === 'chain' && q.op === '-')) ? 20 : 15;
            timeLeft = maxTime;
            return q;
        }

        function nextQuestion() {
            if (!isPlaying) return;
            isProcessingAnswer = false;
            currentQuestion = generateQuestion();
            currentInput = "";
            renderQuestionText();
            document.getElementById('hint-text').classList.add('hidden');
            
            isPaused = false;
            updateButtonsUI();
            
            const bar = document.getElementById('time-bar');
            bar.classList.remove('bg-blue-400', 'bg-red-500', 'bg-yellow-500');
            bar.classList.add('bg-green-500');
            bar.style.width = '100%';
            
            clearInterval(timer);
            timer = setInterval(() => {
                if (!isPaused && isPlaying) {
                    timeLeft--;
                    let percentage = (timeLeft / maxTime) * 100;
                    bar.style.width = Math.max(0, percentage) + '%';
                    
                    if (percentage < 30) {
                        bar.classList.remove('bg-green-500', 'bg-yellow-500');
                        bar.classList.add('bg-red-500');
                    } else if (percentage < 60) {
                        bar.classList.remove('bg-green-500');
                        bar.classList.add('bg-yellow-500');
                    }

                    if (timeLeft <= 0) {
                        clearInterval(timer);
                        handleTimeout();
                    }
                }
            }, 1000);
        }

        function useHint() {
            if (!isPlaying || elephantCount < 2 || isPaused || isProcessingAnswer) return;
            let removed = 0;
            for (let i = animalBodies.length - 1; i >= 0 && removed < 2; i--) {
                if (animalBodies[i].isElephant) {
                    Matter.World.remove(world, animalBodies[i]);
                    animalBodies.splice(i, 1);
                    elephantCount--;
                    removed++;
                }
            }
            
            updateScores();
            isPaused = true; 
            updateButtonsUI();
            const bar = document.getElementById('time-bar');
            bar.className = 'bg-blue-400 h-4 rounded-full transition-all duration-1000 ease-linear w-full';

            const hintBox = document.getElementById('hint-text');
            let hintMsg = "";
            let q = currentQuestion;

            if (q.type === 'normal' && q.op === '+') {
                if (q.num1 + q.num2 > 10 && q.num1 < 10 && q.num2 < 10) {
                    let big = q.num1 >= q.num2 ? q.num1 : q.num2;
                    let small = q.num1 >= q.num2 ? q.num2 : q.num1;
                    let need = 10 - big;
                    let remain = small - need;
                    hintMsg = `💡 合十法：${big}加${need}是10，${small}可以分成${need}和${remain}。把10和${remain}加起來就是答案囉！`;
                } else {
                    hintMsg = "💡 試著用手指頭或心算把數字合起來。";
                }
            } else if (q.type === 'normal' && q.op === '-') {
                if (q.num1 > 10 && q.num1 % 10 < q.num2) {
                    let base = q.num1 % 10;
                    hintMsg = `💡 破十法：${q.num1}可以分成10和${base}。先用10減${q.num2}等於${10-q.num2}，然後用${10-q.num2}加返${base}就係答案囉！`;
                } else {
                    hintMsg = "💡 這是普通的減法，仔細算算看！";
                }
            } else if (q.type === 'algebra') {
                if (q.op === '+') hintMsg = `💡 想一想：${q.num1} 要加上多少，才會變成 ${q.result} 呢？可以反過來用減法算算看喔。`;
                else hintMsg = `💡 推理題：誰減去 ${q.answer} 會變成 ${q.result}？ 或者是 ${q.num1} 減去多少會是 ${q.result}？`;
            } else {
                hintMsg = "💡 連加連減題：可以先算前面兩個數字，得到結果後，再和第三個數字算一次！";
            }

            hintBox.innerText = hintMsg;
            hintBox.classList.remove('hidden');
        }

        function usePause() {
            if (!isPlaying || elephantCount < 1 || isPaused || isProcessingAnswer) return;
            for (let i = animalBodies.length - 1; i >= 0; i--) {
                if (animalBodies[i].isElephant) {
                    Matter.World.remove(world, animalBodies[i]);
                    animalBodies.splice(i, 1);
                    elephantCount--;
                    break;
                }
            }
            isPaused = true;
            updateScores();
            const bar = document.getElementById('time-bar');
            bar.className = 'bg-blue-400 h-4 rounded-full transition-all duration-1000 ease-linear w-full';
        }

        function renderQuestionText() {
            const container = document.getElementById('question-text');
            container.innerHTML = ''; 

            const parts = currentQuestion.text.split('_');
            
            if (parts.length > 1) { 
                let span1 = document.createElement('span'); span1.innerText = parts[0]; container.appendChild(span1);
                let inputSpan = document.createElement('span');
                inputSpan.className = "text-blue-600 border-b-4 border-blue-600 min-w-[3rem] text-center inline-block bg-blue-50 rounded-lg px-2";
                inputSpan.innerText = currentInput || "?"; container.appendChild(inputSpan);
                let span2 = document.createElement('span'); span2.innerText = parts[1]; container.appendChild(span2);
            } else { 
                let textSpan = document.createElement('span'); textSpan.innerText = currentQuestion.text; container.appendChild(textSpan);
                let inputSpan = document.createElement('span'); inputSpan.className = "text-blue-600 ml-2"; inputSpan.innerText = currentInput || "?";
                container.appendChild(inputSpan);
            }
        }

        function inputNumber(num) {
            if (!isPlaying || isProcessingAnswer) return;
            if (currentInput.length < 2) {
                currentInput += num.toString();
                renderQuestionText();
            }
        }

        function clearInput() {
            if (!isPlaying || isProcessingAnswer) return;
            currentInput = "";
            renderQuestionText();
        }

        function checkAnswer() {
            if (!isPlaying || isProcessingAnswer || currentInput === "") return;
            isProcessingAnswer = true;
            clearInterval(timer);
            const playerAnswer = parseInt(currentInput, 10);
            
            if (playerAnswer === currentQuestion.answer) {
                playCoinSound();
                confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 }, colors: ['#26ccff', '#a25afd', '#ff5e7e', '#88ff5a', '#fcff42', '#ffa62d'] });
                
                totalCorrect++;
                currentStreak++;
                if (currentStreak > maxStreak) {
                    maxStreak = currentStreak;
                }
                updateScores();
                addAnimal();
                
                setTimeout(nextQuestion, 1200);
            } else {
                playErrorSound();
                currentStreak = 0;
                lives--;
                updateScores();
                removeLastAnimal();
                
                const qText = document.getElementById('question-text');
                qText.classList.add('text-red-500', 'animate-shake');
                
                setTimeout(() => {
                    qText.classList.remove('text-red-500', 'animate-shake');
                    if (lives <= 0) {
                        endGame();
                    } else {
                        clearInput();
                        nextQuestion();
                    }
                }, 1000);
            }
        }

        function handleTimeout() {
            if (!isPlaying || isProcessingAnswer) return;
            isProcessingAnswer = true;
            playErrorSound();
            currentStreak = 0;
            lives--;
            updateScores();
            removeLastAnimal();
            
            const hintBox = document.getElementById('hint-text');
            hintBox.innerText = `⏰ 時間到了！正確答案是 ${currentQuestion.answer}。`;
            hintBox.classList.remove('hidden');
            
            setTimeout(() => {
                if (lives <= 0) {
                    endGame();
                } else {
                    nextQuestion();
                }
            }, 1500);
        }

        // 手動結束遊戲兩段式按鈕（避免誤觸）
        function triggerManualEnd() {
            if (!isPlaying) return;
            const btn = document.getElementById('end-game-btn');
            if (!manualEndConfirmPending) {
                manualEndConfirmPending = true;
                btn.innerText = "⚠️ 確定結束？(再按一次)";
                btn.classList.replace('bg-rose-500', 'bg-amber-600');
                manualEndTimeout = setTimeout(resetManualEndButton, 3000);
            } else {
                resetManualEndButton();
                endGame();
            }
        }

        function resetManualEndButton() {
            manualEndConfirmPending = false;
            if (manualEndTimeout) clearTimeout(manualEndTimeout);
            const btn = document.getElementById('end-game-btn');
            btn.innerText = "🏁 結束並記錄";
            btn.classList.remove('bg-amber-600');
            btn.classList.add('bg-rose-500');
        }

        // 遊戲完結：停止計時、顯示成績與名稱輸入視窗
        function endGame() {
            isPlaying = false;
            isProcessingAnswer = false;
            clearInterval(timer);
            document.getElementById('end-game-btn').classList.add('hidden');
            updateButtonsUI();

            playGameOverFanfare();

            // 更新彈窗成績顯示
            document.getElementById('final-correct').innerText = totalCorrect;
            document.getElementById('final-max-streak').innerText = maxStreak;

            // 根據表現切換徽章與標題
            const badge = document.getElementById('gameover-badge');
            const title = document.getElementById('gameover-title');
            if (totalCorrect >= 20) {
                badge.innerText = '🦄';
                title.innerText = '傳奇獨角獸大師！';
                confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });
            } else if (totalCorrect >= 10) {
                badge.innerText = '🏆';
                title.innerText = '超級數學小天才！';
                confetti({ particleCount: 100, spread: 80, origin: { y: 0.5 } });
            } else {
                badge.innerText = '🎉';
                title.innerText = '挑戰完結！';
            }

            // 檢查是否符合打入 Top 10 資格（只要大於 0 分且目前榜單不足 10 人或超越第 10 名）
            const qualifies = checkIfQualifiesTop10(totalCorrect, maxStreak);
            const congratsEl = document.getElementById('top10-congrats');
            if (qualifies && (totalCorrect > 0 || maxStreak > 0)) {
                congratsEl.classList.remove('hidden');
            } else {
                congratsEl.classList.add('hidden');
            }

            // 渲染最近使用過的玩家名稱快速按鈕
            renderRecentNames();

            // 顯示彈窗並自動聚焦名稱輸入框
            document.getElementById('name-error-msg').classList.add('hidden');
            const nameInput = document.getElementById('player-name-input');
            nameInput.value = '';
            document.getElementById('gameover-modal').classList.remove('hidden');
            setTimeout(() => nameInput.focus(), 100);
        }

        // ==========================================
        // 5. Top 10 龍虎榜儲存、排序與渲染邏輯
        // ==========================================
        function getLeaderboardData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        }

        function saveLeaderboardData(records) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            } catch (e) {
                console.error('無法儲存龍虎榜資料:', e);
            }
        }

        // 依指定模式排序並截取前 10 名
        function getSortedTop10(records, mode = 'total') {
            const copy = [...records];
            copy.sort((a, b) => {
                if (mode === 'streak') {
                    // 最高連對優先，若相同則比總答對，再相同則比時間較早
                    if (b.maxStreak !== a.maxStreak) return b.maxStreak - a.maxStreak;
                    if (b.totalCorrect !== a.totalCorrect) return b.totalCorrect - a.totalCorrect;
                    return a.timestamp - b.timestamp;
                } else {
                    // 總答對優先，若相同則比最高連對，再相同則比時間較早
                    if (b.totalCorrect !== a.totalCorrect) return b.totalCorrect - a.totalCorrect;
                    if (b.maxStreak !== a.maxStreak) return b.maxStreak - a.maxStreak;
                    return a.timestamp - b.timestamp;
                }
            });
            return copy.slice(0, 10);
        }

        function checkIfQualifiesTop10(scoreTotal, scoreStreak) {
            const records = getLeaderboardData();
            const topTotal = getSortedTop10(records, 'total');
            const topStreak = getSortedTop10(records, 'streak');

            const inTotal = topTotal.length < 10 || scoreTotal > topTotal[topTotal.length - 1].totalCorrect;
            const inStreak = topStreak.length < 10 || scoreStreak > topStreak[topStreak.length - 1].maxStreak;
            return inTotal || inStreak;
        }

        function renderRecentNames() {
            const records = getLeaderboardData();
            const container = document.getElementById('recent-names-container');
            const list = document.getElementById('recent-names-list');
            
            // 取得不重複的最近 5 個玩家名稱
            const uniqueNames = [];
            for (let i = records.length - 1; i >= 0; i--) {
                if (!uniqueNames.includes(records[i].name)) {
                    uniqueNames.push(records[i].name);
                }
                if (uniqueNames.length >= 5) break;
            }

            if (uniqueNames.length === 0) {
                container.classList.add('hidden');
                return;
            }

            list.innerHTML = '';
            uniqueNames.forEach(name => {
                const chip = document.createElement('button');
                chip.type = 'button';
                chip.className = 'text-xs font-bold bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 px-2.5 py-1 rounded-full transition-all';
                chip.innerText = name;
                chip.onclick = () => {
                    document.getElementById('player-name-input').value = name;
                    document.getElementById('name-error-msg').classList.add('hidden');
                };
                list.appendChild(chip);
            });
            container.classList.remove('hidden');
        }

        function handleNameInputKey(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                savePlayerRecord();
            }
        }

        function savePlayerRecord() {
            const inputEl = document.getElementById('player-name-input');
            const name = inputEl.value.trim();

            if (!name) {
                document.getElementById('name-error-msg').classList.remove('hidden');
                inputEl.classList.add('animate-shake', 'border-rose-400');
                setTimeout(() => inputEl.classList.remove('animate-shake'), 400);
                inputEl.focus();
                return;
            }

            const now = new Date();
            const dateStr = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const recordId = Date.now() + '_' + Math.random().toString(36).substr(2, 5);

            const newRecord = {
                id: recordId,
                name: name,
                totalCorrect: totalCorrect,
                maxStreak: maxStreak,
                date: dateStr,
                timestamp: Date.now()
            };

            const records = getLeaderboardData();
            records.push(newRecord);

            // 保留所有曾進入任一榜單前 10 名的紀錄，避免 localStorage 無限膨脹
            const topTotalIds = new Set(getSortedTop10(records, 'total').map(r => r.id));
            const topStreakIds = new Set(getSortedTop10(records, 'streak').map(r => r.id));
            const trimmedRecords = records.filter(r => topTotalIds.has(r.id) || topStreakIds.has(r.id));

            saveLeaderboardData(trimmedRecords);
            lastSavedRecordId = recordId;

            // 關閉結束視窗，顯示遊戲開始覆蓋層並開啟龍虎榜
            document.getElementById('gameover-modal').classList.add('hidden');
            document.getElementById('game-overlay').classList.remove('hidden');
            openLeaderboard();
        }

        function skipAndRestart() {
            document.getElementById('gameover-modal').classList.add('hidden');
            startGame();
        }

        // 開啟龍虎榜（若遊戲進行中會自動暫停計時）
        function openLeaderboard() {
            if (isPlaying && !isPaused) {
                isPaused = true;
                pausedByModal = true;
            }
            renderLeaderboardTable();
            document.getElementById('leaderboard-modal').classList.remove('hidden');
        }

        function closeLeaderboard() {
            document.getElementById('leaderboard-modal').classList.add('hidden');
            resetClearButtonState();
            if (isPlaying && pausedByModal) {
                isPaused = false;
                pausedByModal = false;
            }
        }

        function switchLeaderboardSort(mode) {
            currentSortMode = mode;
            const totalBtn = document.getElementById('sort-total-btn');
            const streakBtn = document.getElementById('sort-streak-btn');

            if (mode === 'total') {
                totalBtn.className = 'py-2 px-3 rounded-lg text-xs sm:text-sm font-black bg-white text-blue-600 shadow transition-all';
                streakBtn.className = 'py-2 px-3 rounded-lg text-xs sm:text-sm font-black text-slate-500 hover:text-slate-700 transition-all';
            } else {
                streakBtn.className = 'py-2 px-3 rounded-lg text-xs sm:text-sm font-black bg-white text-orange-600 shadow transition-all';
                totalBtn.className = 'py-2 px-3 rounded-lg text-xs sm:text-sm font-black text-slate-500 hover:text-slate-700 transition-all';
            }

            renderLeaderboardTable();
        }

        function renderLeaderboardTable() {
            const tbody = document.getElementById('leaderboard-tbody');
            const records = getLeaderboardData();
            const top10 = getSortedTop10(records, currentSortMode);

            tbody.innerHTML = '';

            if (top10.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="py-12 text-center text-slate-400">
                            <div class="text-4xl mb-2">🌱</div>
                            <div class="font-bold text-base">龍虎榜暫時未有紀錄</div>
                            <div class="text-xs mt-1">完成一局遊戲並輸入名字，即可登上榜首！</div>
                        </td>
                    </tr>
                `;
                return;
            }

            top10.forEach((item, index) => {
                const rank = index + 1;
                let rankBadge = `<span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-slate-100 text-slate-600 text-xs font-black">${rank}</span>`;
                let rowBg = 'hover:bg-slate-50';

                if (rank === 1) {
                    rankBadge = '<span class="text-2xl">🥇</span>';
                    rowBg = 'bg-amber-50/70 hover:bg-amber-50';
                } else if (rank === 2) {
                    rankBadge = '<span class="text-2xl">🥈</span>';
                    rowBg = 'bg-slate-50/80 hover:bg-slate-100/80';
                } else if (rank === 3) {
                    rankBadge = '<span class="text-2xl">🥉</span>';
                    rowBg = 'bg-orange-50/50 hover:bg-orange-50';
                }

                const isNew = item.id === lastSavedRecordId;
                if (isNew) {
                    rowBg += ' ring-2 ring-inset ring-green-400 bg-green-50/60';
                }

                const tr = document.createElement('tr');
                tr.className = `${rowBg} transition-colors`;
                tr.innerHTML = `
                    <td class="py-2.5 px-2 text-center">${rankBadge}</td>
                    <td class="py-2.5 px-2 text-slate-800">
                        <div class="flex items-center gap-1.5">
                            <span class="truncate max-w-[120px] sm:max-w-[160px]">${escapeHTML(item.name)}</span>
                            ${isNew ? '<span class="text-[10px] bg-green-500 text-white px-1.5 py-0.5 rounded-full font-black">NEW</span>' : ''}
                        </div>
                    </td>
                    <td class="py-2.5 px-2 text-center ${currentSortMode === 'total' ? 'text-blue-600 text-lg font-black' : 'text-slate-600'}">
                        ${item.totalCorrect}
                    </td>
                    <td class="py-2.5 px-2 text-center ${currentSortMode === 'streak' ? 'text-orange-600 text-lg font-black' : 'text-slate-600'}">
                        ${item.maxStreak}
                    </td>
                    <td class="py-2.5 px-2 text-right text-xs text-slate-400 hidden sm:table-cell">
                        ${item.date || ''}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 兩段式清除排行榜（不使用原生 confirm()）
        function handleClearLeaderboard() {
            const btn = document.getElementById('clear-board-btn');
            if (!clearConfirmPending) {
                clearConfirmPending = true;
                btn.innerText = "⚠️ 再按一次確認清除全部紀錄";
                btn.classList.add('bg-rose-100', 'font-black');
                clearConfirmTimeout = setTimeout(resetClearButtonState, 3500);
            } else {
                localStorage.removeItem(STORAGE_KEY);
                lastSavedRecordId = null;
                resetClearButtonState();
                renderLeaderboardTable();
            }
        }

        function resetClearButtonState() {
            clearConfirmPending = false;
            if (clearConfirmTimeout) clearTimeout(clearConfirmTimeout);
            const btn = document.getElementById('clear-board-btn');
            btn.innerText = "🗑️ 清除排行榜";
            btn.classList.remove('bg-rose-100', 'font-black');
        }

        function escapeHTML(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                })[m];
            });
        }

        // ==========================================
        // 6. 實體鍵盤支援（隔離名稱輸入框避免衝突）
        // ==========================================
        document.addEventListener('keydown', (e) => {
            // 若玩家正在名稱輸入框打字，不觸發遊戲數字鍵盤操作
            if (document.activeElement && document.activeElement.id === 'player-name-input') {
                return;
            }
            if (!isPlaying || isProcessingAnswer) return;

            if (e.key >= '0' && e.key <= '9') {
                inputNumber(e.key);
            } else if (e.key === 'Backspace') {
                clearInput();
            } else if (e.key === 'Enter') {
                checkAnswer();
            }
        });
    </script>
</body>
</html>
