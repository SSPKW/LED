<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>加減法大挑戰</title>
    <!-- 載入 Tailwind CSS、彩帶特效與 Matter.js 物理引擎 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body {
            overscroll-behavior: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .fade-in {
            animation: fadeIn 0.35s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        .animate-shake {
            animation: shake 0.3s ease-in-out 2;
        }

        /* 獎盃點擊彈跳特效 */
        @keyframes trophyPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.3) rotate(-8deg); }
            70% { transform: scale(0.95) rotate(6deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .trophy-pop {
            animation: trophyPop 0.28s ease-out;
        }

        #game-zone canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body class="bg-blue-50 h-screen flex flex-col font-sans overflow-hidden">

    <!-- 主要內容區：設定為 flex-1 並且可滾動，防止內容被擠壓覆蓋 -->
    <div class="flex-1 overflow-y-auto flex flex-col md:flex-row w-full max-w-7xl mx-auto p-2 gap-4 min-h-0">
        
        <!-- 左側：數學問答區 -->
        <div class="w-full md:w-5/12 bg-white rounded-2xl shadow-xl flex flex-col p-4 relative z-10 border-4 border-blue-200 shrink-0">
            <!-- 能量條與控制列 -->
            <div class="w-full bg-gray-200 rounded-full h-4 mb-4 flex-shrink-0 relative overflow-hidden shadow-inner">
                <div id="time-bar" class="bg-green-500 h-4 rounded-full transition-all duration-1000 ease-linear w-full"></div>
            </div>
            
            <div class="flex justify-between items-center mb-4 gap-2 flex-shrink-0">
                <button id="pause-btn" onclick="usePause()" class="flex-1 bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold py-2 px-3 rounded-xl shadow-[0_4px_0_rgb(161,98,7)] active:shadow-[0_0px_0_rgb(161,98,7)] active:translate-y-1 transition-all text-sm sm:text-base flex items-center justify-center gap-1 opacity-50 cursor-not-allowed">
                    ⏳ 諗緊<br><span class="text-xs">(需🐘x1)</span>
                </button>
                <button id="hint-btn" onclick="useHint()" class="flex-1 bg-purple-400 hover:bg-purple-500 text-purple-900 font-bold py-2 px-3 rounded-xl shadow-[0_4px_0_rgb(107,33,168)] active:shadow-[0_0px_0_rgb(107,33,168)] active:translate-y-1 transition-all text-sm sm:text-base flex items-center justify-center gap-1 opacity-50 cursor-not-allowed">
                    💡 提示<br><span class="text-xs">(需🐘x2)</span>
                </button>
            </div>

            <div id="hint-text" class="hidden mb-4 p-3 bg-purple-100 text-purple-800 rounded-lg text-sm font-bold border-2 border-purple-300 flex-shrink-0">
                <!-- 提示內容會在這裡顯示 -->
            </div>

            <!-- 題目顯示區 -->
            <div id="question-container" class="flex-1 flex flex-col items-center justify-center mb-4 min-h-[80px]">
                <div id="question-text" class="text-5xl md:text-6xl font-black text-gray-700 tracking-wider text-center flex items-center justify-center flex-wrap gap-2">
                    <!-- 題目生成在這裡 -->
                </div>
            </div>

            <!-- 數字鍵盤 -->
            <div class="grid grid-cols-3 gap-2 w-full max-w-sm mx-auto flex-shrink-0">
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-3xl font-bold py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(1)">1</button>
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-3xl font-bold py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(2)">2</button>
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-3xl font-bold py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(3)">3</button>
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-3xl font-bold py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(4)">4</button>
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-3xl font-bold py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(5)">5</button>
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-3xl font-bold py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(6)">6</button>
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-3xl font-bold py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(7)">7</button>
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-3xl font-bold py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(8)">8</button>
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-3xl font-bold py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(9)">9</button>
                
                <!-- 清除在左，0在中，確定在右 -->
                <button class="bg-red-100 hover:bg-red-200 text-red-600 text-2xl font-bold py-3 rounded-xl shadow-[0_4px_0_rgb(252,165,165)] active:shadow-[0_0px_0_rgb(252,165,165)] active:translate-y-1 transition-all" onclick="clearInput()">清除</button>
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-3xl font-bold py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(0)">0</button>
                <button class="bg-green-500 hover:bg-green-600 text-white text-2xl font-bold py-3 rounded-xl shadow-[0_4px_0_rgb(21,128,61)] active:shadow-[0_0px_0_rgb(21,128,61)] active:translate-y-1 transition-all" onclick="checkAnswer()">確定</button>
            </div>
        </div>

        <!-- 右側：動物生態地圖區 (Matter.js RTS 視角) -->
        <div id="game-zone" class="w-full md:w-7/12 min-h-[300px] md:min-h-0 rounded-2xl shadow-xl relative overflow-hidden border-4 border-green-400 bg-green-200">
            <div id="canvas-container" class="w-full h-full"></div>
            
            <!-- 開始遊戲覆蓋層 -->
            <div id="game-overlay" class="absolute inset-0 bg-white/80 flex flex-col items-center justify-center gap-4 z-30 backdrop-blur-sm p-4">
                <button onclick="startGame()" class="animate-bounce bg-gradient-to-r from-blue-500 to-purple-600 text-white text-3xl font-black py-4 px-10 rounded-full shadow-2xl hover:scale-105 transition-transform border-4 border-white">
                    ▶️ 開始遊戲
                </button>
                <button onclick="openLeaderboard()" class="bg-amber-400 hover:bg-amber-500 text-amber-950 text-lg font-black py-2.5 px-7 rounded-full shadow-lg hover:scale-105 transition-transform border-2 border-white flex items-center gap-2">
                    🏆 查看龍虎榜
                </button>
            </div>
        </div>
    </div>

    <!-- 底部：標題與狀態列 -->
    <div class="w-full bg-slate-800 text-white py-3 px-4 sm:px-6 shadow-lg z-40 rounded-t-3xl mt-2 flex flex-col sm:flex-row justify-between items-center gap-2 shrink-0">
        <div class="flex items-center gap-3">
            <h1 class="text-lg sm:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-500">🌟 加減法大挑戰</h1>
            <button onclick="openLeaderboard()" class="bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-400/40 text-xs sm:text-sm font-bold py-1 px-3 rounded-full transition-all flex items-center gap-1">
                🏆 龍虎榜
            </button>
            <button id="finish-btn" onclick="openSubmitModal()" class="hidden bg-emerald-500 hover:bg-emerald-600 text-white text-xs sm:text-sm font-bold py-1 px-3 rounded-full shadow transition-all">
                🏁 結束並登榜
            </button>
        </div>
        <div class="flex gap-4 sm:gap-6 text-sm sm:text-lg font-bold bg-slate-700 py-1 px-4 rounded-full">
            <div>答對: <span id="correct-score" class="text-green-400 text-xl sm:text-2xl">0</span></div>
            <div>連對: <span id="streak-score" class="text-yellow-400 text-xl sm:text-2xl">0</span></div>
            <div title="可用於暫停或提示">大象🐘: <span id="elephant-score" class="text-pink-400 text-xl sm:text-2xl">0</span></div>
        </div>
    </div>

    <!-- 結算並輸入名字登榜視窗 -->
    <div id="submit-modal" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl border-4 border-purple-400 shadow-2xl w-full max-w-md p-6 fade-in text-center">
            <div class="text-5xl mb-2">🎉</div>
            <h2 class="text-2xl font-black text-slate-800 mb-1">挑戰完成！</h2>
            <p class="text-slate-500 text-sm mb-4">輸入你的名字，將戰績記錄到龍虎榜吧！</p>
            
            <div class="grid grid-cols-2 gap-3 bg-slate-50 p-4 rounded-2xl mb-4 border border-slate-100">
                <div>
                    <div class="text-xs text-slate-400 font-bold">本局總答對</div>
                    <div id="summary-correct" class="text-3xl font-black text-blue-600">0</div>
                </div>
                <div>
                    <div class="text-xs text-slate-400 font-bold">本局最高連對</div>
                    <div id="summary-max-streak" class="text-3xl font-black text-amber-500">0</div>
                </div>
            </div>

            <input id="player-name-input" type="text" maxlength="12" placeholder="請輸入小數學家名字..." class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-purple-500 focus:outline-none text-center text-lg font-bold text-slate-700 mb-4">

            <div class="flex gap-3">
                <button onclick="closeSubmitModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl transition-all">繼續挑戰</button>
                <button onclick="saveScoreToLeaderboard()" class="flex-1 bg-gradient-to-r from-blue-500 to-purple-600 text-white font-bold py-3 rounded-xl shadow-lg hover:opacity-95 transition-all">🏆 登上龍虎榜</button>
            </div>
        </div>
    </div>

    <!-- 加減法龍虎榜 (Top 10) 視窗 -->
    <div id="leaderboard-modal" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-4">
        <div class="bg-white rounded-3xl border-4 border-amber-400 shadow-2xl w-full max-w-2xl p-5 sm:p-6 fade-in relative flex flex-col max-h-[90vh]">
            
            <!-- 標題列：點擊獎盃圖案 10 次可觸發隱藏清除功能 -->
            <div class="flex items-start justify-between mb-4">
                <div class="flex items-center gap-3 relative">
                    <button id="secret-trophy-btn" onclick="handleTrophySecretClick()" type="button" aria-label="獎盃圖案" class="text-4xl sm:text-5xl leading-none cursor-pointer select-none touch-manipulation focus:outline-none transition-transform">
                        🏆
                    </button>
                    <div>
                        <h2 class="text-xl sm:text-2xl font-black text-slate-800 tracking-tight">加減法龍虎榜 (Top 10)</h2>
                        <p class="text-xs sm:text-sm text-slate-400 font-medium">記錄最強小數學家的連對與總對戰績</p>
                    </div>
                    <!-- 連續點擊進度小提示（點滿 5 次後低調顯示） -->
                    <span id="trophy-tap-hint" class="hidden absolute -bottom-5 left-0 bg-amber-100 text-amber-800 text-[11px] font-bold px-2 py-0.5 rounded-full shadow-sm whitespace-nowrap">
                        再點 5 次...
                    </span>
                </div>
                <button onclick="closeLeaderboard()" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center font-bold text-lg transition-colors">
                    ✕
                </button>
            </div>

            <!-- 排序切換分頁 -->
            <div class="bg-slate-100 p-1.5 rounded-2xl grid grid-cols-2 gap-1.5 mb-4 shrink-0">
                <button id="sort-total-btn" onclick="setLeaderboardSort('total')" class="py-2 px-3 rounded-xl text-xs sm:text-sm font-bold transition-all bg-white text-blue-600 shadow-sm flex items-center justify-center gap-1.5">
                    <span>📊</span> 總答對優先 (總對 → 連對)
                </button>
                <button id="sort-streak-btn" onclick="setLeaderboardSort('streak')" class="py-2 px-3 rounded-xl text-xs sm:text-sm font-bold transition-all text-slate-500 hover:text-slate-700 flex items-center justify-center gap-1.5">
                    <span>🔥</span> 最高連對優先 (連對 → 總對)
                </button>
            </div>

            <!-- 排行榜列表區 -->
            <div class="flex-1 overflow-y-auto min-h-[240px] flex flex-col">
                <!-- 表頭 -->
                <div class="grid grid-cols-12 text-xs sm:text-sm font-bold text-slate-400 pb-2.5 px-2 border-b border-slate-100 shrink-0">
                    <div class="col-span-2 text-center">名次</div>
                    <div class="col-span-4">玩家名稱</div>
                    <div class="col-span-2 text-center">總答對</div>
                    <div class="col-span-2 text-center">最高連對</div>
                    <div class="col-span-2 text-right">日期</div>
                </div>

                <!-- 內容區（有資料時顯示列表，無資料時顯示幼苗空狀態） -->
                <div id="leaderboard-list" class="flex-1 flex flex-col">
                    <!-- 動態生成 -->
                </div>
            </div>

            <!-- 系統通知氣泡（例如已清除排行榜） -->
            <div id="leaderboard-toast" class="hidden mt-3 py-2 px-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs sm:text-sm font-bold text-center">
                ✅ 排行榜紀錄已成功清除！
            </div>

            <!-- 底部按鈕列（已隱藏「清除排行榜」按鈕，僅保留關閉與開始新遊戲） -->
            <div class="border-t border-slate-100 pt-4 mt-4 flex items-center justify-end gap-3 shrink-0">
                <button onclick="closeLeaderboard()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 px-6 rounded-xl text-sm sm:text-base transition-colors">
                    關閉
                </button>
                <button onclick="startNewGameFromLeaderboard()" class="bg-gradient-to-r from-blue-500 to-purple-600 hover:opacity-95 text-white font-bold py-2.5 px-6 rounded-xl text-sm sm:text-base shadow-lg flex items-center gap-1.5 transition-all">
                    <span>▶️</span> 開始新遊戲
                </button>
            </div>

            <!-- 隱藏功能確認覆蓋層（連按獎盃 10 次後觸發，取代瀏覽器原生 confirm） -->
            <div id="clear-confirm-overlay" class="hidden absolute inset-0 bg-white/95 backdrop-blur-sm rounded-3xl z-20 flex flex-col items-center justify-center p-6 text-center fade-in">
                <div class="text-5xl mb-3">🏆</div>
                <h3 class="text-xl font-black text-slate-800 mb-2">已解鎖隱藏管理功能</h3>
                <p class="text-slate-500 text-sm mb-6">確定要清除所有「加減法龍虎榜」紀錄嗎？此動作無法復原。</p>
                <div class="flex gap-3 w-full max-w-xs">
                    <button onclick="cancelClearLeaderboard()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl transition-colors">
                        取消
                    </button>
                    <button onclick="confirmClearLeaderboard()" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-2.5 rounded-xl shadow-md transition-colors">
                        確定清除
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ================= 音效系統 =================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playCoinSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(987.77, audioCtx.currentTime); 
            oscillator.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.1); 
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
        }

        function playErrorSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playTapTickSound(step) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            // 隨著連按次數提高音調
            osc.frequency.setValueAtTime(440 + step * 55, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        // ================= 遊戲狀態變數 =================
        let currentQuestion = {};
        let currentInput = "";
        let timer;
        let timeLeft = 15;
        let maxTime = 15;
        let isPaused = false;
        let qCount = 0;
        let totalCorrect = 0;
        let currentStreak = 0;
        let maxStreak = 0;
        let elephantCount = 0;
        let isPlaying = false;

        // ================= 龍虎榜與隱藏清除機制變數 =================
        const LEADERBOARD_STORAGE_KEY = 'math_challenge_leaderboard_v1';
        let leaderboardSortMode = 'total'; // 'total' | 'streak'
        let trophyClickCount = 0;
        let trophyResetTimeout = null;

        // ================= Matter.js 物理生態引擎 =================
        const Engine = Matter.Engine,
              Render = Matter.Render,
              Runner = Matter.Runner,
              Bodies = Matter.Bodies,
              Composite = Matter.Composite,
              Mouse = Matter.Mouse,
              MouseConstraint = Matter.MouseConstraint,
              Events = Matter.Events;

        let engine, render, runner, world;
        let animalBodies = [];
        let terrainBodies = [];
        let animalAIInterval;

        const CAT_WALL = 0x0001;
        const CAT_FOREST = 0x0002;
        const CAT_WATER = 0x0004;
        const CAT_ELEPHANT = 0x0008;
        const CAT_FELINE = 0x0010;
        const CAT_OTHER = 0x0020;

        function initPhysics() {
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            engine = Engine.create();
            world = engine.world;
            engine.gravity.y = 0; // RTS 上帝視角，無重力
            engine.gravity.x = 0;

            render = Render.create({
                element: container,
                engine: engine,
                options: {
                    width: width,
                    height: height,
                    wireframes: false,
                    background: 'transparent'
                }
            });

            const wallOptions = { 
                isStatic: true, 
                render: { fillStyle: 'transparent' },
                collisionFilter: { category: CAT_WALL }
            };
            Composite.add(world, [
                Bodies.rectangle(width/2, -50, width+200, 100, wallOptions),
                Bodies.rectangle(width/2, height+50, width+200, 100, wallOptions),
                Bodies.rectangle(-50, height/2, 100, height+200, wallOptions),
                Bodies.rectangle(width+50, height/2, 100, height+200, wallOptions)
            ]);

            generateTerrain(width, height);

            const mouse = Mouse.create(render.canvas);
            const mouseConstraint = MouseConstraint.create(engine, {
                mouse: mouse,
                constraint: { stiffness: 0.2, render: { visible: false } }
            });
            Composite.add(world, mouseConstraint);
            render.mouse = mouse;

            Events.on(render, 'afterRender', function() {
                const ctx = render.context;
                
                terrainBodies.forEach(b => {
                    let r = b.baseRadius;
                    if (b.isForest) {
                        ctx.font = `${r * 0.6}px Arial`;
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText('🌲', b.position.x - r*0.4, b.position.y - r*0.3);
                        ctx.fillText('🌳', b.position.x + r*0.4, b.position.y + r*0.2);
                        ctx.fillText('🍄', b.position.x + r*0.1, b.position.y - r*0.5);
                    }
                    if (b.isWater) {
                        ctx.font = `${r * 0.55}px Arial`;
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText('🌊', b.position.x, b.position.y);
                        ctx.fillText('🐟', b.position.x - r*0.4, b.position.y + r*0.3);
                        ctx.fillText('🦆', b.position.x + r*0.3, b.position.y - r*0.3);
                    }
                });

                animalBodies.forEach(body => {
                    if (body.isUnicorn) {
                        if (!body.trail) body.trail = [];
                        body.trail.unshift({ x: body.position.x, y: body.position.y });
                        if (body.trail.length > 20) body.trail.pop();
                        ctx.beginPath();
                        for (let i = 0; i < body.trail.length - 1; i++) {
                            ctx.moveTo(body.trail[i].x, body.trail[i].y);
                            ctx.lineTo(body.trail[i+1].x, body.trail[i+1].y);
                        }
                        ctx.lineWidth = 15;
                        ctx.strokeStyle = `hsla(${(Date.now() + (body.hueOffset || 0)) % 360}, 100%, 60%, 0.5)`;
                        ctx.lineCap = 'round';
                        ctx.stroke();
                    }

                    ctx.font = `${body.circleRadius * 1.5}px Arial`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    
                    let alpha = 1;
                    if (Date.now() - body.creationTime < 1000) {
                        alpha = (Date.now() - body.creationTime) / 1000;
                    }
                    ctx.globalAlpha = alpha;
                    
                    ctx.translate(body.position.x, body.position.y);
                    if (body.velocity.x < -0.1) ctx.scale(-1, 1);
                    
                    ctx.beginPath();
                    ctx.arc(0, 0, body.circleRadius * 1.1, 0, 2 * Math.PI);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                    ctx.fill();

                    ctx.fillText(body.emoji, 0, 0);
                    ctx.setTransform(1, 0, 0, 1, 0, 0);
                    ctx.globalAlpha = 1;
                });
            });

            Render.run(render);
            runner = Runner.create();
            Runner.run(runner, engine);
            
            startAnimalAI();
        }

        function generateTerrain(w, h) {
            for(let i=0; i<2; i++) {
                let r = Math.random() * 30 + 40;
                let sides = Math.floor(Math.random() * 4) + 5;
                let body = Bodies.polygon(Math.random()*(w-r*4)+r*2, Math.random()*(h-r*4)+r*2, sides, r, {
                    isStatic: true, isForest: true,
                    chamfer: { radius: r * 0.35 },
                    render: { fillStyle: 'rgba(34, 139, 34, 0.4)', strokeStyle: 'transparent' },
                    collisionFilter: { category: CAT_FOREST, mask: CAT_ELEPHANT }
                });
                Matter.Body.scale(body, 1 + Math.random() * 0.8, 1 + Math.random() * 0.8);
                body.baseRadius = r;
                terrainBodies.push(body);
                Composite.add(world, body);
            }
            for(let i=0; i<2; i++) {
                let r = Math.random() * 30 + 40;
                let sides = Math.floor(Math.random() * 4) + 5;
                let body = Bodies.polygon(Math.random()*(w-r*4)+r*2, Math.random()*(h-r*4)+r*2, sides, r, {
                    isStatic: true, isWater: true,
                    chamfer: { radius: r * 0.35 },
                    render: { fillStyle: 'rgba(64, 164, 255, 0.4)', strokeStyle: 'transparent' },
                    collisionFilter: { category: CAT_WATER, mask: CAT_FELINE }
                });
                Matter.Body.scale(body, 1 + Math.random() * 0.8, 1 + Math.random() * 0.8);
                body.baseRadius = r;
                terrainBodies.push(body);
                Composite.add(world, body);
            }
        }

        function addAnimal() {
            if (!engine) return;
            const container = document.getElementById('canvas-container');
            const w = container.clientWidth;
            const h = container.clientHeight;

            let emoji, radius, category, mask;
            let isUnicorn = false;
            let isElephant = false;

            // 每答對 20 題（20、40、60...）便會生成一隻獨角獸，總數不限
            if (totalCorrect > 0 && totalCorrect % 20 === 0) {
                emoji = '🦄'; radius = 50 * 0.7; isUnicorn = true;
                category = CAT_OTHER;
                mask = CAT_WALL | CAT_ELEPHANT | CAT_FELINE | CAT_OTHER; 
            } else if (currentStreak >= 7) {
                emoji = '🐘'; radius = 45 * 0.7; isElephant = true;
                category = CAT_ELEPHANT;
                mask = CAT_WALL | CAT_FOREST | CAT_ELEPHANT | CAT_FELINE | CAT_OTHER;
            } else if (currentStreak === 6) {
                emoji = '🦁'; radius = 35 * 0.7; category = CAT_FELINE; mask = CAT_WALL | CAT_WATER | CAT_ELEPHANT | CAT_FELINE | CAT_OTHER;
            } else if (currentStreak === 5) {
                emoji = '🐅'; radius = 33 * 0.7; category = CAT_FELINE; mask = CAT_WALL | CAT_WATER | CAT_ELEPHANT | CAT_FELINE | CAT_OTHER;
            } else if (currentStreak === 4) {
                emoji = '🐆'; radius = 30 * 0.7; category = CAT_FELINE; mask = CAT_WALL | CAT_WATER | CAT_ELEPHANT | CAT_FELINE | CAT_OTHER;
            } else if (currentStreak === 3) {
                emoji = '🐶'; radius = 28 * 0.7; category = CAT_OTHER; mask = CAT_WALL | CAT_ELEPHANT | CAT_FELINE | CAT_OTHER;
            } else if (currentStreak === 2) {
                emoji = '🐱'; radius = 25 * 0.7; category = CAT_FELINE; mask = CAT_WALL | CAT_WATER | CAT_ELEPHANT | CAT_FELINE | CAT_OTHER;
            } else {
                emoji = '🐭'; radius = 20 * 0.7; category = CAT_OTHER; mask = CAT_WALL | CAT_ELEPHANT | CAT_FELINE | CAT_OTHER;
            }

            if (isElephant) {
                elephantCount++;
                updateButtonsUI();
            }

            const body = Bodies.circle(Math.random()*(w-100)+50, Math.random()*(h-100)+50, radius, {
                restitution: isUnicorn ? 1.0 : 0.2,
                friction: 0.1,
                frictionAir: 0.05,
                mass: isUnicorn ? 50 : (isElephant ? 30 : radius), 
                collisionFilter: { category: category, mask: mask },
                render: { visible: false }, 
            });

            body.emoji = emoji;
            body.isUnicorn = isUnicorn;
            body.isElephant = isElephant;
            body.creationTime = Date.now();
            if (isUnicorn) {
                body.hueOffset = Math.floor(Math.random() * 360);
            }
            
            animalBodies.push(body);
            Composite.add(world, body);
        }

        function startAnimalAI() {
            if (animalAIInterval) clearInterval(animalAIInterval);
            animalAIInterval = setInterval(() => {
                animalBodies.forEach(block => {
                    if (block.isUnicorn) {
                        if (Date.now() - block.creationTime < 2000) return;
                        if (Math.random() < 0.5) {
                            let forceMag = 0.08 * block.mass; 
                            let angle = Math.random() * Math.PI * 2; 
                            Matter.Body.applyForce(block, block.position, {
                                x: Math.cos(angle) * forceMag, 
                                y: Math.sin(angle) * forceMag
                            });
                        }
                    } else {
                        if (Math.random() < 0.25) { 
                            let forceMag = 0.01 * block.mass;
                            let angle = Math.random() * Math.PI * 2; 
                            Matter.Body.applyForce(block, block.position, {
                                x: Math.cos(angle) * forceMag, 
                                y: Math.sin(angle) * forceMag
                            });
                        }
                    }
                });
            }, 200); 
        }

        function removeLastAnimal() {
            if (!engine || animalBodies.length === 0) return;
            for (let i = animalBodies.length - 1; i >= 0; i--) {
                if (!animalBodies[i].isUnicorn) {
                    const blockToRemove = animalBodies[i];
                    if (blockToRemove.isElephant) elephantCount--;
                    Matter.World.remove(world, blockToRemove);
                    animalBodies.splice(i, 1);
                    updateButtonsUI();
                    return;
                }
            }
        }

        function clearAllAnimals() {
            if (!world) return;
            animalBodies.forEach(b => Matter.World.remove(world, b));
            animalBodies = [];
            elephantCount = 0;
            updateButtonsUI();
        }

        // ================= 遊戲流程控制 =================
        function startGame() {
            document.getElementById('game-overlay').classList.add('hidden');
            isPlaying = true;
            qCount = 0;
            totalCorrect = 0;
            currentStreak = 0;
            maxStreak = 0;
            elephantCount = 0;
            
            if (!engine) {
                initPhysics();
            } else {
                clearAllAnimals();
            }
            updateScores();
            nextQuestion();
        }

        function updateScores() {
            document.getElementById('correct-score').innerText = totalCorrect;
            document.getElementById('streak-score').innerText = currentStreak;
            document.getElementById('elephant-score').innerText = elephantCount;
            
            // 有答對紀錄時顯示「結束並登榜」按鈕
            const finishBtn = document.getElementById('finish-btn');
            if (isPlaying && totalCorrect > 0) {
                finishBtn.classList.remove('hidden');
            } else {
                finishBtn.classList.add('hidden');
            }
            updateButtonsUI();
        }

        function updateButtonsUI() {
            const pauseBtn = document.getElementById('pause-btn');
            const hintBtn = document.getElementById('hint-btn');
            
            if (elephantCount >= 1 && !isPaused) pauseBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            else pauseBtn.classList.add('opacity-50', 'cursor-not-allowed');
            
            if (elephantCount >= 2 && !isPaused) hintBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            else hintBtn.classList.add('opacity-50', 'cursor-not-allowed');
        }

        function generateQuestion() {
            qCount++;
            let q = {};
            let requiresBorrow = false;

            if (qCount % 4 === 0) {
                if (Math.random() < 0.5) {
                    q.type = 'chain'; q.op = Math.random() < 0.5 ? '+' : '-';
                    if (q.op === '+') {
                        q.num1 = Math.floor(Math.random() * 8) + 1;
                        q.num2 = Math.floor(Math.random() * 8) + 1;
                        q.num3 = Math.floor(Math.random() * 6) + 1;
                        q.answer = q.num1 + q.num2 + q.num3;
                        q.text = `${q.num1} + ${q.num2} + ${q.num3} = `;
                    } else {
                        q.num1 = Math.floor(Math.random() * 6) + 14; 
                        q.num2 = Math.floor(Math.random() * 6) + 1;
                        q.num3 = Math.floor(Math.random() * 5) + 1;
                        q.answer = q.num1 - q.num2 - q.num3;
                        q.text = `${q.num1} - ${q.num2} - ${q.num3} = `;
                        if (q.num1 % 10 < q.num2) requiresBorrow = true;
                    }
                } else {
                    q.type = 'algebra'; q.op = Math.random() < 0.5 ? '+' : '-';
                    if (q.op === '+') {
                        q.num1 = Math.floor(Math.random() * 10) + 1;
                        q.answer = Math.floor(Math.random() * 10) + 1;
                        q.result = q.num1 + q.answer;
                        if (Math.random() < 0.5) { q.text = `${q.num1} + _ = ${q.result}`; q.blankPos = 2; } 
                        else { q.text = `_ + ${q.num1} = ${q.result}`; q.blankPos = 1; }
                    } else {
                        q.result = Math.floor(Math.random() * 9) + 1; 
                        q.answer = Math.floor(Math.random() * 9) + 1; 
                        q.num1 = q.result + q.answer; 
                        if (Math.random() < 0.5) { 
                            q.text = `${q.num1} - _ = ${q.result}`; 
                            q.blankPos = 2; 
                        } else { 
                            q.text = `_ - ${q.answer} = ${q.result}`; 
                            q.blankPos = 1; 
                            q.answer = q.num1;
                        }
                    }
                }
            } else {
                q.type = 'normal'; q.op = Math.random() < 0.5 ? '+' : '-';
                if (q.op === '+') {
                    q.num1 = Math.floor(Math.random() * 19) + 1;
                    q.num2 = Math.floor(Math.random() * (20 - q.num1)) + 1;
                    q.answer = q.num1 + q.num2;
                    q.text = `${q.num1} + ${q.num2} = `;
                } else {
                    q.num1 = Math.floor(Math.random() * 10) + 11;
                    q.num2 = Math.floor(Math.random() * 10) + 1; 
                    if (q.num1 < q.num2) { let temp = q.num1; q.num1 = q.num2; q.num2 = temp; }
                    q.answer = q.num1 - q.num2;
                    q.text = `${q.num1} - ${q.num2} = `;
                    if (q.num1 % 10 < q.num2) requiresBorrow = true;
                }
            }

            maxTime = (requiresBorrow || (q.type === 'chain' && q.op === '-')) ? 20 : 15;
            timeLeft = maxTime;
            return q;
        }

        function nextQuestion() {
            currentQuestion = generateQuestion();
            currentInput = "";
            renderQuestionText();
            document.getElementById('hint-text').classList.add('hidden');
            
            isPaused = false;
            updateButtonsUI();
            
            const bar = document.getElementById('time-bar');
            bar.classList.remove('bg-blue-400', 'bg-red-500', 'bg-yellow-500');
            bar.classList.add('bg-green-500');
            bar.style.width = '100%';
            
            clearInterval(timer);
            timer = setInterval(() => {
                if (!isPaused) {
                    timeLeft--;
                    let percentage = (timeLeft / maxTime) * 100;
                    bar.style.width = percentage + '%';
                    
                    if (percentage < 30) bar.classList.replace('bg-yellow-500', 'bg-red-500') || bar.classList.replace('bg-green-500', 'bg-red-500');
                    else if (percentage < 60) bar.classList.replace('bg-green-500', 'bg-yellow-500');

                    if (timeLeft <= 0) {
                        clearInterval(timer);
                        handleTimeout();
                    }
                }
            }, 1000);
        }

        function useHint() {
            if (elephantCount >= 2 && !isPaused) {
                let removed = 0;
                for (let i = animalBodies.length - 1; i >= 0 && removed < 2; i--) {
                    if (animalBodies[i].isElephant) {
                        Matter.World.remove(world, animalBodies[i]);
                        animalBodies.splice(i, 1);
                        elephantCount--;
                        removed++;
                    }
                }
                
                updateScores();
                isPaused = true; 
                const bar = document.getElementById('time-bar');
                bar.className = 'bg-blue-400 h-4 rounded-full transition-all duration-1000 ease-linear w-full';

                const hintBox = document.getElementById('hint-text');
                let hintMsg = "";
                let q = currentQuestion;

                if (q.type === 'normal' && q.op === '+') {
                    if (q.num1 + q.num2 > 10 && q.num1 < 10 && q.num2 < 10) {
                        let big = q.num1 >= q.num2 ? q.num1 : q.num2;
                        let small = q.num1 >= q.num2 ? q.num2 : q.num1;
                        let need = 10 - big;
                        let remain = small - need;
                        hintMsg = `💡 合十法：${big}加${need}是10，${small}可以分成${need}和${remain}。把10和${remain}加起來就是答案囉！`;
                    } else {
                        hintMsg = "💡 試著用手指頭或心算把數字合起來。";
                    }
                } else if (q.type === 'normal' && q.op === '-') {
                    if (q.num1 > 10 && q.num1 % 10 < q.num2) {
                        let base = q.num1 % 10;
                        hintMsg = `💡 破十法：${q.num1}可以分成10和${base}。先用10減${q.num2}等於${10-q.num2}，然後用${10-q.num2}加返${base}就係答案囉！`;
                    } else {
                        hintMsg = "💡 這是普通的減法，仔細算算看！";
                    }
                } else if (q.type === 'algebra') {
                    if (q.op === '+') hintMsg = `💡 想一想：${q.num1} 要加上多少，才會變成 ${q.result} 呢？可以反過來用減法算算看喔。`;
                    else hintMsg = `💡 推理題：誰減去 ${q.answer} 會變成 ${q.result}？ 或者是 ${q.num1} 減去多少會是 ${q.result}？`;
                } else {
                    hintMsg = "💡 連加連減題：可以先算前面兩個數字，得到結果後，再和第三個數字算一次！";
                }

                hintBox.innerText = hintMsg;
                hintBox.classList.remove('hidden');
            }
        }

        function usePause() {
            if (elephantCount >= 1 && !isPaused) {
                for (let i = animalBodies.length - 1; i >= 0; i--) {
                    if (animalBodies[i].isElephant) {
                        Matter.World.remove(world, animalBodies[i]);
                        animalBodies.splice(i, 1);
                        elephantCount--;
                        break;
                    }
                }
                isPaused = true;
                updateScores();
                const bar = document.getElementById('time-bar');
                bar.className = 'bg-blue-400 h-4 rounded-full transition-all duration-1000 ease-linear w-full';
            }
        }

        function renderQuestionText() {
            const container = document.getElementById('question-text');
            container.innerHTML = ''; 

            const parts = currentQuestion.text.split('_');
            
            if (parts.length > 1) { 
                let span1 = document.createElement('span'); span1.innerText = parts[0]; container.appendChild(span1);
                let inputSpan = document.createElement('span');
                inputSpan.className = "text-blue-600 border-b-4 border-blue-600 min-w-[3rem] text-center inline-block bg-blue-50 rounded-lg px-2";
                inputSpan.innerText = currentInput || "?"; container.appendChild(inputSpan);
                let span2 = document.createElement('span'); span2.innerText = parts[1]; container.appendChild(span2);
            } else { 
                let textSpan = document.createElement('span'); textSpan.innerText = currentQuestion.text; container.appendChild(textSpan);
                let inputSpan = document.createElement('span'); inputSpan.className = "text-blue-600 ml-2"; inputSpan.innerText = currentInput || "?";
                container.appendChild(inputSpan);
            }
        }

        function inputNumber(num) {
            if (!isPlaying) return;
            if (currentInput.length < 2) {
                currentInput += num.toString();
                renderQuestionText();
            }
        }

        function clearInput() {
            if (!isPlaying) return;
            currentInput = "";
            renderQuestionText();
        }

        function checkAnswer() {
            if (!isPlaying || currentInput === "") return;
            clearInterval(timer);
            const playerAnswer = parseInt(currentInput, 10);
            
            if (playerAnswer === currentQuestion.answer) {
                playCoinSound();
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#26ccff', '#a25afd', '#ff5e7e', '#88ff5a', '#fcff42', '#ffa62d'] });
                
                totalCorrect++;
                currentStreak++;
                if (currentStreak > maxStreak) maxStreak = currentStreak;
                updateScores();
                addAnimal();

                // 每達成 20 題倍數召喚獨角獸時，追加雙側彩帶慶祝
                if (totalCorrect % 20 === 0) {
                    confetti({ particleCount: 80, angle: 60, spread: 65, origin: { x: 0.1, y: 0.6 } });
                    confetti({ particleCount: 80, angle: 120, spread: 65, origin: { x: 0.9, y: 0.6 } });
                }
                
                setTimeout(nextQuestion, 1500);
            } else {
                playErrorSound();
                currentStreak = 0;
                updateScores();
                
                const qText = document.getElementById('question-text');
                qText.classList.add('text-red-500', 'animate-shake');
                removeLastAnimal();
                
                setTimeout(() => {
                    qText.classList.remove('text-red-500', 'animate-shake');
                    clearInput();
                    nextQuestion();
                }, 1000);
            }
        }

        function handleTimeout() {
            playErrorSound();
            currentStreak = 0;
            updateScores();
            removeLastAnimal();
            
            const hintBox = document.getElementById('hint-text');
            hintBox.innerText = "⏰ 哎呀！時間到了！再試一次吧！";
            hintBox.classList.remove('hidden');
            
            setTimeout(nextQuestion, 2000);
        }

        // ================= 龍虎榜資料與互動邏輯 =================
        function getLeaderboardData() {
            try {
                const raw = localStorage.getItem(LEADERBOARD_STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        }

        function saveLeaderboardData(records) {
            try {
                localStorage.setItem(LEADERBOARD_STORAGE_KEY, JSON.stringify(records));
            } catch (e) {
                console.error('儲存龍虎榜失敗:', e);
            }
        }

        function openSubmitModal() {
            isPaused = true;
            document.getElementById('summary-correct').innerText = totalCorrect;
            document.getElementById('summary-max-streak').innerText = maxStreak;
            document.getElementById('player-name-input').value = '';
            document.getElementById('submit-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('player-name-input').focus(), 100);
        }

        function closeSubmitModal() {
            document.getElementById('submit-modal').classList.add('hidden');
            if (isPlaying) {
                isPaused = false;
            }
        }

        function saveScoreToLeaderboard() {
            const nameInput = document.getElementById('player-name-input').value.trim();
            const playerName = nameInput || '無名小數學家';
            const now = new Date();
            const dateStr = `${now.getMonth() + 1}/${now.getDate()}`;

            const records = getLeaderboardData();
            records.push({
                id: Date.now(),
                name: playerName,
                totalCorrect: totalCorrect,
                maxStreak: maxStreak,
                date: dateStr
            });

            // 最多保留前 50 筆以應對兩種排序切換（顯示 Top 10）
            records.sort((a, b) => (b.totalCorrect - a.totalCorrect) || (b.maxStreak - a.maxStreak));
            saveLeaderboardData(records.slice(0, 50));

            // 結束當前局數並顯示開始覆蓋層
            clearInterval(timer);
            isPlaying = false;
            document.getElementById('finish-btn').classList.add('hidden');
            document.getElementById('game-overlay').classList.remove('hidden');
            document.getElementById('submit-modal').classList.add('hidden');

            openLeaderboard();
        }

        function openLeaderboard() {
            if (isPlaying) isPaused = true;
            resetTrophyClickCounter();
            document.getElementById('clear-confirm-overlay').classList.add('hidden');
            document.getElementById('leaderboard-toast').classList.add('hidden');
            renderLeaderboard();
            document.getElementById('leaderboard-modal').classList.remove('hidden');
        }

        function closeLeaderboard() {
            resetTrophyClickCounter();
            document.getElementById('leaderboard-modal').classList.add('hidden');
            if (isPlaying && document.getElementById('submit-modal').classList.contains('hidden')) {
                isPaused = false;
            }
        }

        function startNewGameFromLeaderboard() {
            closeLeaderboard();
            startGame();
        }

        function renderLeaderboard() {
            const listContainer = document.getElementById('leaderboard-list');
            const records = getLeaderboardData();

            if (records.length === 0) {
                listContainer.innerHTML = `
                    <div class="flex-1 flex flex-col items-center justify-center py-12 text-center">
                        <div class="text-5xl mb-3">🌱</div>
                        <div class="text-lg font-black text-slate-400 mb-1">龍虎榜暫時未有紀錄</div>
                        <div class="text-xs sm:text-sm text-slate-400">完成一局遊戲並輸入名字，即可登上榜首！</div>
                    </div>
                `;
                return;
            }

            const sorted = [...records].sort((a, b) => {
                if (leaderboardSortMode === 'total') {
                    return (b.totalCorrect - a.totalCorrect) || (b.maxStreak - a.maxStreak);
                } else {
                    return (b.maxStreak - a.maxStreak) || (b.totalCorrect - a.totalCorrect);
                }
            }).slice(0, 10);

            listContainer.innerHTML = sorted.map((item, idx) => {
                const rank = idx + 1;
                let rankBadge = `<span class="font-bold text-slate-500">${rank}</span>`;
                let rowBg = 'hover:bg-slate-50';
                if (rank === 1) { rankBadge = '<span class="text-xl">🥇</span>'; rowBg = 'bg-amber-50/70'; }
                else if (rank === 2) { rankBadge = '<span class="text-xl">🥈</span>'; rowBg = 'bg-slate-50/80'; }
                else if (rank === 3) { rankBadge = '<span class="text-xl">🥉</span>'; rowBg = 'bg-orange-50/50'; }

                return `
                    <div class="grid grid-cols-12 items-center py-2.5 px-2 border-b border-slate-50 text-sm sm:text-base ${rowBg} rounded-lg">
                        <div class="col-span-2 text-center">${rankBadge}</div>
                        <div class="col-span-4 font-bold text-slate-700 truncate pr-2">${escapeHtml(item.name)}</div>
                        <div class="col-span-2 text-center font-black text-blue-600">${item.totalCorrect}</div>
                        <div class="col-span-2 text-center font-black text-amber-500">${item.maxStreak}</div>
                        <div class="col-span-2 text-right text-xs text-slate-400 font-medium">${escapeHtml(item.date)}</div>
                    </div>
                `;
            }).join('');
        }

        // ================= 連續點按獎盃圖案 10 次清除排行榜 =================
        function handleTrophySecretClick() {
            const trophyBtn = document.getElementById('secret-trophy-btn');
            const tapHint = document.getElementById('trophy-tap-hint');

            // 觸發微動畫與輕快音效
            trophyBtn.classList.remove('trophy-pop');
            void trophyBtn.offsetWidth; // 強制重繪以重新播放動畫
            trophyBtn.classList.add('trophy-pop');

            trophyClickCount++;
            playTapTickSound(trophyClickCount);

            // 若超過 2.5 秒沒有繼續連續點擊，自動重置計數
            clearTimeout(trophyResetTimeout);
            trophyResetTimeout = setTimeout(() => {
                resetTrophyClickCounter();
            }, 2500);

            if (trophyClickCount >= 5 && trophyClickCount < 10) {
                tapHint.innerText = `再按 ${10 - trophyClickCount} 次...`;
                tapHint.classList.remove('hidden');
            } else if (trophyClickCount >= 10) {
                resetTrophyClickCounter();
                // 顯示自訂確認面板（取代瀏覽器原生 confirm）
                document.getElementById('clear-confirm-overlay').classList.remove('hidden');
            }
        }

        function resetTrophyClickCounter() {
            trophyClickCount = 0;
            clearTimeout(trophyResetTimeout);
            const tapHint = document.getElementById('trophy-tap-hint');
            if (tapHint) tapHint.classList.add('hidden');
        }

        function cancelClearLeaderboard() {
            document.getElementById('clear-confirm-overlay').classList.add('hidden');
        }

        function confirmClearLeaderboard() {
            saveLeaderboardData([]);
            document.getElementById('clear-confirm-overlay').classList.add('hidden');
            renderLeaderboard();

            const toast = document.getElementById('leaderboard-toast');
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // 鍵盤支援（避免在輸入名字時誤觸作答按鍵）
        document.addEventListener('keydown', (e) => {
            if (document.activeElement && document.activeElement.tagName === 'INPUT') {
                if (e.key === 'Enter') saveScoreToLeaderboard();
                return;
            }
            if (e.key >= '0' && e.key <= '9') inputNumber(e.key);
            else if (e.key === 'Backspace') clearInput();
            else if (e.key === 'Enter') checkAnswer();
        });
    </script>
</body>
</html>
