<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>加減法大挑戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body {
            overscroll-behavior: none;
            user-select: none;
        }
        
        .fade-in {
            animation: fadeIn 1s ease-in forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        #game-zone canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body class="bg-blue-50 h-screen flex flex-col font-sans overflow-hidden">

    <!-- 主要內容區：設定為 flex-1 並且可滾動，防止內容被擠壓覆蓋 -->
    <div class="flex-1 overflow-y-auto flex flex-col md:flex-row w-full max-w-7xl mx-auto p-2 gap-4 min-h-0">
        
        <!-- 左側：數學問答區 -->
        <div class="w-full md:w-5/12 bg-white rounded-2xl shadow-xl flex flex-col p-4 relative z-10 border-4 border-blue-200 shrink-0">
            <!-- 能量條與控制列 -->
            <div class="w-full bg-gray-200 rounded-full h-4 mb-4 flex-shrink-0 relative overflow-hidden shadow-inner">
                <div id="time-bar" class="bg-green-500 h-4 rounded-full transition-all duration-1000 ease-linear w-full"></div>
            </div>
            
            <div class="flex justify-between items-center mb-4 gap-2 flex-shrink-0">
                <button id="pause-btn" onclick="usePause()" class="flex-1 bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold py-2 px-3 rounded-xl shadow-[0_4px_0_rgb(161,98,7)] active:shadow-[0_0px_0_rgb(161,98,7)] active:translate-y-1 transition-all text-sm sm:text-base flex items-center justify-center gap-1 opacity-50 cursor-not-allowed">
                    ⏳ 諗緊<br><span class="text-xs">(需🐘x1)</span>
                </button>
                <button id="hint-btn" onclick="useHint()" class="flex-1 bg-purple-400 hover:bg-purple-500 text-purple-900 font-bold py-2 px-3 rounded-xl shadow-[0_4px_0_rgb(107,33,168)] active:shadow-[0_0px_0_rgb(107,33,168)] active:translate-y-1 transition-all text-sm sm:text-base flex items-center justify-center gap-1 opacity-50 cursor-not-allowed">
                    💡 提示<br><span class="text-xs">(需🐘x2)</span>
                </button>
            </div>

            <div id="hint-text" class="hidden mb-4 p-3 bg-purple-100 text-purple-800 rounded-lg text-sm font-bold border-2 border-purple-300 flex-shrink-0">
                <!-- 提示內容會在這裡顯示 -->
            </div>

            <!-- 題目顯示區 -->
            <div id="question-container" class="flex-1 flex flex-col items-center justify-center mb-4 min-h-[80px]">
                <div id="question-text" class="text-5xl md:text-6xl font-black text-gray-700 tracking-wider text-center flex items-center justify-center flex-wrap gap-2">
                    <!-- 題目生成在這裡 -->
                </div>
            </div>

            <!-- 數字鍵盤 (全新排版：清除和確定移到最下層) -->
            <div class="grid grid-cols-3 gap-2 w-full max-w-sm mx-auto flex-shrink-0">
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-3xl font-bold py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(1)">1</button>
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-3xl font-bold py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(2)">2</button>
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-3xl font-bold py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(3)">3</button>
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-3xl font-bold py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(4)">4</button>
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-3xl font-bold py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(5)">5</button>
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-3xl font-bold py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(6)">6</button>
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-3xl font-bold py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(7)">7</button>
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-3xl font-bold py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(8)">8</button>
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-3xl font-bold py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(9)">9</button>
                
                <!-- 清除在左，0在中，確定在右 -->
                <button class="bg-red-100 hover:bg-red-200 text-red-600 text-2xl font-bold py-3 rounded-xl shadow-[0_4px_0_rgb(252,165,165)] active:shadow-[0_0px_0_rgb(252,165,165)] active:translate-y-1 transition-all" onclick="clearInput()">清除</button>
                <button class="numpad-btn bg-blue-100 hover:bg-blue-200 text-blue-800 text-3xl font-bold py-3 rounded-xl shadow-[0_4px_0_rgb(147,197,253)] active:shadow-[0_0px_0_rgb(147,197,253)] active:translate-y-1 transition-all" onclick="inputNumber(0)">0</button>
                <button class="bg-green-500 hover:bg-green-600 text-white text-2xl font-bold py-3 rounded-xl shadow-[0_4px_0_rgb(21,128,61)] active:shadow-[0_0px_0_rgb(21,128,61)] active:translate-y-1 transition-all" onclick="checkAnswer()">確定</button>
            </div>
        </div>

        <!-- 右側：動物生態地圖區 (Matter.js RTS 視角) -->
        <div id="game-zone" class="w-full md:w-7/12 min-h-[300px] md:min-h-0 rounded-2xl shadow-xl relative overflow-hidden border-4 border-green-400 bg-green-200">
            <div id="canvas-container" class="w-full h-full"></div>
            
            <button onclick="clearAnimals()" class="absolute bottom-4 left-4 bg-red-500 text-white p-2 rounded-full shadow-lg hover:bg-red-600 z-20" title="清空動物">
                🗑️
            </button>
            
            <div id="game-overlay" class="absolute inset-0 bg-white/80 flex flex-col items-center justify-center z-30 backdrop-blur-sm">
                <button onclick="startGame()" class="animate-bounce bg-gradient-to-r from-blue-500 to-purple-600 text-white text-3xl font-black py-4 px-10 rounded-full shadow-2xl hover:scale-105 transition-transform border-4 border-white">
                    ▶️ 開始遊戲
                </button>
            </div>
        </div>
    </div>

    <!-- 底部：標題與狀態列 (設定 shrink-0 保證不被壓縮遮擋) -->
    <div class="w-full bg-slate-800 text-white py-3 px-4 sm:px-6 shadow-lg z-50 rounded-t-3xl mt-2 flex flex-col sm:flex-row justify-between items-center gap-2 shrink-0">
        <h1 class="text-lg sm:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-500">🌟 小一數學挑戰：生態觀察箱</h1>
        <div class="flex gap-4 sm:gap-6 text-sm sm:text-lg font-bold bg-slate-700 py-1 px-4 rounded-full">
            <div>答對: <span id="correct-score" class="text-green-400 text-xl sm:text-2xl">0</span></div>
            <div>連對: <span id="streak-score" class="text-yellow-400 text-xl sm:text-2xl">0</span></div>
            <div title="可用於暫停或提示">大象🐘: <span id="elephant-score" class="text-pink-400 text-xl sm:text-2xl">0</span></div>
        </div>
    </div>

    <script>
        // 音效系統
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playCoinSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(987.77, audioCtx.currentTime); 
            oscillator.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.1); 
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
        }
        function playErrorSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        let currentQuestion = {};
        let currentInput = "";
        let timer;
        let timeLeft = 15;
        let maxTime = 15;
        let isPaused = false;
        let qCount = 0;
        let totalCorrect = 0;
        let currentStreak = 0;
        let elephantCount = 0;
        let isPlaying = false;

        const Engine = Matter.Engine,
              Render = Matter.Render,
              Runner = Matter.Runner,
              Bodies = Matter.Bodies,
              Composite = Matter.Composite,
              Mouse = Matter.Mouse,
              MouseConstraint = Matter.MouseConstraint,
              Events = Matter.Events;

        let engine, render, runner, world;
        let animalBodies = [];
        let terrainBodies = [];
        let animalAIInterval;

        const CAT_WALL = 0x0001;
        const CAT_FOREST = 0x0002;
        const CAT_WATER = 0x0004;
        const CAT_ELEPHANT = 0x0008;
        const CAT_FELINE = 0x0010;
        const CAT_OTHER = 0x0020;

        function initPhysics() {
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            engine = Engine.create();
            world = engine.world;
            engine.gravity.y = 0; // RTS 上帝視角，無重力
            engine.gravity.x = 0;

            render = Render.create({
                element: container,
                engine: engine,
                options: {
                    width: width,
                    height: height,
                    wireframes: false,
                    background: 'transparent'
                }
            });

            const wallOptions = { 
                isStatic: true, 
                render: { fillStyle: 'transparent' },
                collisionFilter: { category: CAT_WALL }
            };
            Composite.add(world, [
                Bodies.rectangle(width/2, -50, width+200, 100, wallOptions),
                Bodies.rectangle(width/2, height+50, width+200, 100, wallOptions),
                Bodies.rectangle(-50, height/2, 100, height+200, wallOptions),
                Bodies.rectangle(width+50, height/2, 100, height+200, wallOptions)
            ]);

            generateTerrain(width, height);

            const mouse = Mouse.create(render.canvas);
            const mouseConstraint = MouseConstraint.create(engine, {
                mouse: mouse,
                constraint: { stiffness: 0.2, render: { visible: false } }
            });
            Composite.add(world, mouseConstraint);
            render.mouse = mouse;

            Events.on(render, 'afterRender', function() {
                const ctx = render.context;
                
                terrainBodies.forEach(b => {
                    let r = b.baseRadius; // 使用紀錄的基礎半徑來排版 emoji
                    if (b.isForest) {
                        ctx.font = `${r * 0.6}px Arial`;
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText('🌲', b.position.x - r*0.4, b.position.y - r*0.3);
                        ctx.fillText('🌳', b.position.x + r*0.4, b.position.y + r*0.2);
                        ctx.fillText('🍄', b.position.x + r*0.1, b.position.y - r*0.5);
                    }
                    if (b.isWater) {
                        ctx.font = `${r * 0.55}px Arial`;
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText('🌊', b.position.x, b.position.y);
                        ctx.fillText('🐟', b.position.x - r*0.4, b.position.y + r*0.3);
                        ctx.fillText('🦆', b.position.x + r*0.3, b.position.y - r*0.3);
                    }
                });

                animalBodies.forEach(body => {
                    if (body.isUnicorn) {
                        if (!body.trail) body.trail = [];
                        body.trail.unshift({ x: body.position.x, y: body.position.y });
                        if (body.trail.length > 20) body.trail.pop();
                        ctx.beginPath();
                        for (let i = 0; i < body.trail.length - 1; i++) {
                            ctx.moveTo(body.trail[i].x, body.trail[i].y);
                            ctx.lineTo(body.trail[i+1].x, body.trail[i+1].y);
                        }
                        ctx.lineWidth = 15;
                        ctx.strokeStyle = `hsla(${Date.now() % 360}, 100%, 60%, 0.5)`;
                        ctx.lineCap = 'round';
                        ctx.stroke();
                    }

                    ctx.font = `${body.circleRadius * 1.5}px Arial`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    
                    let alpha = 1;
                    if (Date.now() - body.creationTime < 1000) {
                        alpha = (Date.now() - body.creationTime) / 1000;
                    }
                    ctx.globalAlpha = alpha;
                    
                    ctx.translate(body.position.x, body.position.y);
                    if (body.velocity.x < -0.1) ctx.scale(-1, 1);
                    
                    // 新增：繪製半透明白色底層，讓動物在複雜背景中更清晰明顯
                    ctx.beginPath();
                    ctx.arc(0, 0, body.circleRadius * 1.1, 0, 2 * Math.PI);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                    ctx.fill();

                    ctx.fillText(body.emoji, 0, 0);
                    ctx.setTransform(1, 0, 0, 1, 0, 0);
                    ctx.globalAlpha = 1;
                });
            });

            Render.run(render);
            runner = Runner.create();
            Runner.run(runner, engine);
            
            startAnimalAI();
        }

        function generateTerrain(w, h) {
            for(let i=0; i<2; i++) {
                let r = Math.random() * 30 + 40;
                let sides = Math.floor(Math.random() * 4) + 5; // 隨機 5 到 8 邊形
                let body = Bodies.polygon(Math.random()*(w-r*4)+r*2, Math.random()*(h-r*4)+r*2, sides, r, {
                    isStatic: true, isForest: true,
                    chamfer: { radius: r * 0.35 }, // 圓角化產生有機的自然邊緣
                    render: { fillStyle: 'rgba(34, 139, 34, 0.4)', strokeStyle: 'transparent' },
                    collisionFilter: { category: CAT_FOREST, mask: CAT_ELEPHANT }
                });
                Matter.Body.scale(body, 1 + Math.random() * 0.8, 1 + Math.random() * 0.8); // 隨機拉伸變形成不規則狀
                body.baseRadius = r;
                terrainBodies.push(body);
                Composite.add(world, body);
            }
            for(let i=0; i<2; i++) {
                let r = Math.random() * 30 + 40;
                let sides = Math.floor(Math.random() * 4) + 5; // 隨機 5 到 8 邊形
                let body = Bodies.polygon(Math.random()*(w-r*4)+r*2, Math.random()*(h-r*4)+r*2, sides, r, {
                    isStatic: true, isWater: true,
                    chamfer: { radius: r * 0.35 }, // 圓角化產生有機的自然邊緣
                    render: { fillStyle: 'rgba(64, 164, 255, 0.4)', strokeStyle: 'transparent' },
                    collisionFilter: { category: CAT_WATER, mask: CAT_FELINE }
                });
                Matter.Body.scale(body, 1 + Math.random() * 0.8, 1 + Math.random() * 0.8); // 隨機拉伸變形成不規則狀
                body.baseRadius = r;
                terrainBodies.push(body);
                Composite.add(world, body);
            }
        }

        function addAnimal() {
            if (!engine) return;
            const container = document.getElementById('canvas-container');
            const w = container.clientWidth;
            const h = container.clientHeight;

            let emoji, radius, category, mask;
            let isUnicorn = false;
            let isElephant = false;

            // 尺寸整體縮小30%，獨角獸第20題專屬
            if (totalCorrect === 20) {
                emoji = '🦄'; radius = 50 * 0.7; isUnicorn = true;
                category = CAT_OTHER;
                mask = CAT_WALL | CAT_ELEPHANT | CAT_FELINE | CAT_OTHER; 
            } else if (currentStreak >= 7) {
                emoji = '🐘'; radius = 45 * 0.7; isElephant = true;
                category = CAT_ELEPHANT;
                mask = CAT_WALL | CAT_FOREST | CAT_ELEPHANT | CAT_FELINE | CAT_OTHER;
            } else if (currentStreak === 6) {
                emoji = '🦁'; radius = 35 * 0.7; category = CAT_FELINE; mask = CAT_WALL | CAT_WATER | CAT_ELEPHANT | CAT_FELINE | CAT_OTHER;
            } else if (currentStreak === 5) {
                emoji = '🐅'; radius = 33 * 0.7; category = CAT_FELINE; mask = CAT_WALL | CAT_WATER | CAT_ELEPHANT | CAT_FELINE | CAT_OTHER;
            } else if (currentStreak === 4) {
                emoji = '🐆'; radius = 30 * 0.7; category = CAT_FELINE; mask = CAT_WALL | CAT_WATER | CAT_ELEPHANT | CAT_FELINE | CAT_OTHER;
            } else if (currentStreak === 3) {
                emoji = '🐶'; radius = 28 * 0.7; category = CAT_OTHER; mask = CAT_WALL | CAT_ELEPHANT | CAT_FELINE | CAT_OTHER;
            } else if (currentStreak === 2) {
                emoji = '🐱'; radius = 25 * 0.7; category = CAT_FELINE; mask = CAT_WALL | CAT_WATER | CAT_ELEPHANT | CAT_FELINE | CAT_OTHER;
            } else {
                emoji = '🐭'; radius = 20 * 0.7; category = CAT_OTHER; mask = CAT_WALL | CAT_ELEPHANT | CAT_FELINE | CAT_OTHER;
            }

            if (isElephant) {
                elephantCount++;
                updateButtonsUI();
            }

            const body = Bodies.circle(Math.random()*(w-100)+50, Math.random()*(h-100)+50, radius, {
                restitution: isUnicorn ? 1.0 : 0.2,
                friction: 0.1,
                frictionAir: 0.05,
                mass: isUnicorn ? 50 : (isElephant ? 30 : radius), 
                collisionFilter: { category: category, mask: mask },
                render: { visible: false }, 
            });

            body.emoji = emoji;
            body.isUnicorn = isUnicorn;
            body.isElephant = isElephant;
            body.creationTime = Date.now();
            
            animalBodies.push(body);
            Composite.add(world, body);
        }

        function startAnimalAI() {
            if (animalAIInterval) clearInterval(animalAIInterval);
            animalAIInterval = setInterval(() => {
                animalBodies.forEach(block => {
                    if (block.isUnicorn) {
                        if (Date.now() - block.creationTime < 2000) return;
                        if (Math.random() < 0.5) {
                            let forceMag = 0.08 * block.mass; 
                            let angle = Math.random() * Math.PI * 2; 
                            Matter.Body.applyForce(block, block.position, {
                                x: Math.cos(angle) * forceMag, 
                                y: Math.sin(angle) * forceMag
                            });
                        }
                    } else {
                        // 修改：減慢一般動物的移動速度，讓使用者能清楚看見
                        if (Math.random() < 0.25) { 
                            let forceMag = 0.01 * block.mass; // 從 0.03 大幅下調至 0.01 變成悠閒散步
                            let angle = Math.random() * Math.PI * 2; 
                            Matter.Body.applyForce(block, block.position, {
                                x: Math.cos(angle) * forceMag, 
                                y: Math.sin(angle) * forceMag
                            });
                        }
                    }
                });
            }, 200); 
        }

        function removeLastAnimal() {
            if (!engine || animalBodies.length === 0) return;
            for (let i = animalBodies.length - 1; i >= 0; i--) {
                if (!animalBodies[i].isUnicorn) {
                    const blockToRemove = animalBodies[i];
                    if (blockToRemove.isElephant) elephantCount--;
                    Matter.World.remove(world, blockToRemove);
                    animalBodies.splice(i, 1);
                    updateButtonsUI();
                    return;
                }
            }
        }

        function clearAnimals() {
            if (!world) return;
            const toRemove = animalBodies.filter(b => !b.isUnicorn);
            toRemove.forEach(b => Matter.World.remove(world, b));
            animalBodies = animalBodies.filter(b => b.isUnicorn);
            elephantCount = 0;
            updateButtonsUI();
        }

        function startGame() {
            document.getElementById('game-overlay').classList.add('hidden');
            isPlaying = true;
            qCount = 0;
            totalCorrect = 0;
            currentStreak = 0;
            elephantCount = 0;
            
            if(!engine) initPhysics();
            updateScores();
            nextQuestion();
        }

        function updateScores() {
            document.getElementById('correct-score').innerText = totalCorrect;
            document.getElementById('streak-score').innerText = currentStreak;
            document.getElementById('elephant-score').innerText = elephantCount;
            updateButtonsUI();
        }

        function updateButtonsUI() {
            const pauseBtn = document.getElementById('pause-btn');
            const hintBtn = document.getElementById('hint-btn');
            
            if (elephantCount >= 1 && !isPaused) pauseBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            else pauseBtn.classList.add('opacity-50', 'cursor-not-allowed');
            
            if (elephantCount >= 2 && !isPaused) hintBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            else hintBtn.classList.add('opacity-50', 'cursor-not-allowed');
        }

        function generateQuestion() {
            qCount++;
            let q = {};
            let requiresBorrow = false;

            if (qCount % 4 === 0) {
                if (Math.random() < 0.5) {
                    q.type = 'chain'; q.op = Math.random() < 0.5 ? '+' : '-';
                    if (q.op === '+') {
                        q.num1 = Math.floor(Math.random() * 8) + 1;
                        q.num2 = Math.floor(Math.random() * 8) + 1;
                        q.num3 = Math.floor(Math.random() * 6) + 1;
                        q.answer = q.num1 + q.num2 + q.num3;
                        q.text = `${q.num1} + ${q.num2} + ${q.num3} = `;
                    } else {
                        q.num1 = Math.floor(Math.random() * 6) + 14; 
                        q.num2 = Math.floor(Math.random() * 6) + 1;
                        q.num3 = Math.floor(Math.random() * 5) + 1;
                        q.answer = q.num1 - q.num2 - q.num3;
                        q.text = `${q.num1} - ${q.num2} - ${q.num3} = `;
                        if (q.num1 % 10 < q.num2) requiresBorrow = true;
                    }
                } else {
                    q.type = 'algebra'; q.op = Math.random() < 0.5 ? '+' : '-';
                    if (q.op === '+') {
                        q.num1 = Math.floor(Math.random() * 10) + 1;
                        q.answer = Math.floor(Math.random() * 10) + 1;
                        q.result = q.num1 + q.answer;
                        if (Math.random() < 0.5) { q.text = `${q.num1} + _ = ${q.result}`; q.blankPos = 2; } 
                        else { q.text = `_ + ${q.num1} = ${q.result}`; q.blankPos = 1; }
                    } else {
                        q.result = Math.floor(Math.random() * 9) + 1; 
                        q.answer = Math.floor(Math.random() * 9) + 1; 
                        q.num1 = q.result + q.answer; 
                        if (Math.random() < 0.5) { 
                            q.text = `${q.num1} - _ = ${q.result}`; 
                            q.blankPos = 2; 
                        } 
                        else { 
                            q.text = `_ - ${q.answer} = ${q.result}`; 
                            q.blankPos = 1; 
                            q.answer = q.num1; // 修復：當未知數在最前面時，答案應為原被減數
                        }
                    }
                }
            } else {
                q.type = 'normal'; q.op = Math.random() < 0.5 ? '+' : '-';
                if (q.op === '+') {
                    q.num1 = Math.floor(Math.random() * 19) + 1;
                    q.num2 = Math.floor(Math.random() * (20 - q.num1)) + 1;
                    q.answer = q.num1 + q.num2;
                    q.text = `${q.num1} + ${q.num2} = `;
                } else {
                    q.num1 = Math.floor(Math.random() * 10) + 11;
                    q.num2 = Math.floor(Math.random() * 10) + 1; 
                    if (q.num1 < q.num2) { let temp = q.num1; q.num1 = q.num2; q.num2 = temp; }
                    q.answer = q.num1 - q.num2;
                    q.text = `${q.num1} - ${q.num2} = `;
                    if (q.num1 % 10 < q.num2) requiresBorrow = true;
                }
            }

            maxTime = (requiresBorrow || (q.type === 'chain' && q.op === '-')) ? 20 : 15;
            timeLeft = maxTime;
            return q;
        }

        function nextQuestion() {
            currentQuestion = generateQuestion();
            currentInput = "";
            renderQuestionText();
            document.getElementById('hint-text').classList.add('hidden');
            
            isPaused = false;
            updateButtonsUI();
            
            const bar = document.getElementById('time-bar');
            bar.classList.remove('bg-blue-400', 'bg-red-500', 'bg-yellow-500');
            bar.classList.add('bg-green-500');
            bar.style.width = '100%';
            
            clearInterval(timer);
            timer = setInterval(() => {
                if (!isPaused) {
                    timeLeft--;
                    let percentage = (timeLeft / maxTime) * 100;
                    bar.style.width = percentage + '%';
                    
                    if (percentage < 30) bar.classList.replace('bg-yellow-500', 'bg-red-500') || bar.classList.replace('bg-green-500', 'bg-red-500');
                    else if (percentage < 60) bar.classList.replace('bg-green-500', 'bg-yellow-500');

                    if (timeLeft <= 0) {
                        clearInterval(timer);
                        handleTimeout();
                    }
                }
            }, 1000);
        }

        function useHint() {
            if (elephantCount >= 2 && !isPaused) {
                // 消耗 2 隻大象
                let removed = 0;
                for (let i = animalBodies.length - 1; i >= 0 && removed < 2; i--) {
                    if (animalBodies[i].isElephant) {
                        Matter.World.remove(world, animalBodies[i]);
                        animalBodies.splice(i, 1);
                        elephantCount--;
                        removed++;
                    }
                }
                
                updateScores();
                isPaused = true; 
                const bar = document.getElementById('time-bar');
                bar.className = 'bg-blue-400 h-4 rounded-full transition-all duration-1000 ease-linear w-full';

                const hintBox = document.getElementById('hint-text');
                let hintMsg = "";
                let q = currentQuestion;

                // 智能合十法解讀 (給方法，不直接給答案)
                if (q.type === 'normal' && q.op === '+') {
                    if (q.num1 + q.num2 > 10 && q.num1 < 10 && q.num2 < 10) {
                        let big = q.num1 >= q.num2 ? q.num1 : q.num2;
                        let small = q.num1 >= q.num2 ? q.num2 : q.num1;
                        let need = 10 - big;
                        let remain = small - need;
                        hintMsg = `💡 合十法：${big}加${need}是10，${small}可以分成${need}和${remain}。把10和${remain}加起來就是答案囉！`;
                    } else {
                        hintMsg = "💡 試著用手指頭或心算把數字合起來。";
                    }
                } else if (q.type === 'normal' && q.op === '-') {
                    if (q.num1 > 10 && q.num1 % 10 < q.num2) {
                        let base = q.num1 % 10;
                        let remain = q.num2 - base;
                        hintMsg = `💡 破十法：${q.num1}可以分成10和${base}。先用10減${q.num2}等於${10-q.num2}，然後用${10-q.num2}加返${base}就係答案囉！`;
                    } else {
                        hintMsg = "💡 這是普通的減法，仔細算算看！";
                    }
                } else if (q.type === 'algebra') {
                    if (q.op === '+') hintMsg = `💡 想一想：${q.num1} 要加上多少，才會變成 ${q.result} 呢？可以反過來用減法算算看喔。`;
                    else hintMsg = `💡 推理題：誰減去 ${q.answer} 會變成 ${q.result}？ 或者是 ${q.num1} 減去多少會是 ${q.result}？`;
                } else {
                    hintMsg = "💡 連加連減題：可以先算前面兩個數字，得到結果後，再和第三個數字算一次！";
                }

                hintBox.innerText = hintMsg;
                hintBox.classList.remove('hidden');
            }
        }

        function usePause() {
            if (elephantCount >= 1 && !isPaused) {
                for (let i = animalBodies.length - 1; i >= 0; i--) {
                    if (animalBodies[i].isElephant) {
                        Matter.World.remove(world, animalBodies[i]);
                        animalBodies.splice(i, 1);
                        elephantCount--;
                        break;
                    }
                }
                isPaused = true;
                updateScores();
                const bar = document.getElementById('time-bar');
                bar.className = 'bg-blue-400 h-4 rounded-full transition-all duration-1000 ease-linear w-full';
            }
        }

        function renderQuestionText() {
            const container = document.getElementById('question-text');
            container.innerHTML = ''; 

            const parts = currentQuestion.text.split('_');
            
            if (parts.length > 1) { 
                let span1 = document.createElement('span'); span1.innerText = parts[0]; container.appendChild(span1);
                let inputSpan = document.createElement('span');
                inputSpan.className = "text-blue-600 border-b-4 border-blue-600 min-w-[3rem] text-center inline-block bg-blue-50 rounded-lg px-2";
                inputSpan.innerText = currentInput || "?"; container.appendChild(inputSpan);
                let span2 = document.createElement('span'); span2.innerText = parts[1]; container.appendChild(span2);
            } else { 
                let textSpan = document.createElement('span'); textSpan.innerText = currentQuestion.text; container.appendChild(textSpan);
                let inputSpan = document.createElement('span'); inputSpan.className = "text-blue-600 ml-2"; inputSpan.innerText = currentInput || "?";
                container.appendChild(inputSpan);
            }
        }

        function inputNumber(num) {
            if (currentInput.length < 2) {
                currentInput += num.toString();
                renderQuestionText();
            }
        }

        function clearInput() {
            currentInput = "";
            renderQuestionText();
        }

        function checkAnswer() {
            if (currentInput === "") return;
            clearInterval(timer);
            const playerAnswer = parseInt(currentInput);
            
            if (playerAnswer === currentQuestion.answer) {
                playCoinSound();
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#26ccff', '#a25afd', '#ff5e7e', '#88ff5a', '#fcff42', '#ffa62d'] });
                
                totalCorrect++;
                currentStreak++;
                updateScores();
                addAnimal();
                
                setTimeout(nextQuestion, 1500);
            } else {
                playErrorSound();
                currentStreak = 0;
                updateScores();
                
                const qText = document.getElementById('question-text');
                qText.classList.add('text-red-500', 'animate-shake');
                removeLastAnimal();
                
                setTimeout(() => {
                    qText.classList.remove('text-red-500', 'animate-shake');
                    clearInput();
                    nextQuestion();
                }, 1000);
            }
        }

        function handleTimeout() {
            playErrorSound();
            currentStreak = 0;
            updateScores();
            removeLastAnimal();
            
            const hintBox = document.getElementById('hint-text');
            hintBox.innerText = "⏰ 哎呀！時間到了！再試一次吧！";
            hintBox.classList.remove('hidden');
            
            setTimeout(nextQuestion, 2000);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') inputNumber(e.key);
            else if (e.key === 'Backspace') clearInput();
            else if (e.key === 'Enter') checkAnswer();
        });

    </script>
</body>
</html>
