<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>蜘蛛俠：蜘蛛絲飛躍 Spider-Man Web Swing (RK3528 優化版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            background-color: #0b0f19;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            /* 邊緣平滑處理，適合低解析度拉伸 */
            image-rendering: optimizeSpeed;
        }
        /* 輕量化蜘蛛感應警告 (使用純邊框代替模糊) */
        .spidey-sense-active {
            border: 8px solid rgba(239, 68, 68, 0.8);
            box-sizing: border-box;
        }
        .joystick-base {
            width: 110px;
            height: 110px;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(56, 189, 248, 0.5);
            border-radius: 50%;
            position: relative;
            touch-action: none;
        }
        .joystick-stick {
            width: 46px;
            height: 46px;
            background: #0284c7;
            border: 2px solid #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        /* 替代原有的玻璃模糊效果，改用高不透明度純色 */
        .glass-panel {
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden select-none text-white">

    <!-- Canvas Game View -->
    <div id="spidey-sense-overlay" class="absolute inset-0 pointer-events-none z-10"></div>
    <canvas id="gameCanvas" class="absolute inset-0 z-0"></canvas>

    <!-- Top HUD Interface -->
    <div class="absolute top-4 left-4 right-4 z-20 flex justify-between items-start pointer-events-none">
        <!-- Health & Web Fluid Bars -->
        <div class="flex flex-col gap-2 w-48 sm:w-64 glass-panel p-3 rounded-2xl pointer-events-auto">
            <!-- Health Bar -->
            <div>
                <div class="flex justify-between text-xs font-bold mb-1 tracking-wider text-red-400">
                    <span><i class="fa-solid fa-heart mr-1"></i> 生命值 (HP)</span>
                    <span id="hp-text">100%</span>
                </div>
                <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden p-0.5 border border-slate-700">
                    <div id="hp-bar" class="bg-red-500 h-full rounded-full transition-all duration-200" style="width: 100%;"></div>
                </div>
            </div>
            <!-- Web Fluid Bar -->
            <div>
                <div class="flex justify-between text-xs font-bold mb-1 tracking-wider text-cyan-400">
                    <span><i class="fa-solid fa-bolt mr-1"></i> 蜘蛛絲能量</span>
                    <span id="web-text">100%</span>
                </div>
                <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden p-0.5 border border-slate-700">
                    <div id="web-bar" class="bg-cyan-500 h-full rounded-full transition-all duration-150" style="width: 100%;"></div>
                </div>
            </div>
        </div>

        <!-- Score & Distance HUD -->
        <div class="glass-panel px-5 py-3 rounded-2xl text-center pointer-events-auto flex flex-col items-center">
            <div class="text-xs uppercase tracking-widest text-slate-400 font-bold">飛躍距離</div>
            <div class="text-2xl sm:text-3xl font-extrabold text-amber-400 font-mono tracking-tight" id="dist-display">0 <span class="text-sm font-normal text-slate-300">m</span></div>
            <div class="text-xs text-slate-300 mt-0.5 font-semibold">得分: <span id="score-display" class="text-white">0</span></div>
        </div>
    </div>

    <!-- Combo Notification Toast -->
    <div id="combo-toast" class="absolute top-28 left-1/2 -translate-x-1/2 z-20 pointer-events-none opacity-0 transform -translate-y-4 transition-all duration-300 text-center">
        <span id="combo-text" class="text-2xl sm:text-3xl font-black italic text-amber-400 drop-shadow">
            GREAT SWING!
        </span>
    </div>

    <!-- Controls UI -->
    <div class="absolute bottom-6 left-6 right-6 z-20 flex justify-between items-end pointer-events-none">
        <!-- Virtual Joystick Area -->
        <div class="pointer-events-auto flex flex-col items-center gap-1">
            <div id="joystick-container" class="joystick-base flex items-center justify-center">
                <div id="joystick-stick" class="joystick-stick"></div>
            </div>
            <span class="text-[10px] font-bold tracking-wider text-slate-400 bg-slate-900 px-2 py-0.5 rounded-full border border-slate-700">方向搖桿</span>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row gap-2.5 pointer-events-auto">
            <button id="btn-attack-web" class="glass-panel px-4 py-3 rounded-2xl bg-amber-600 active:scale-95 transition-all flex items-center gap-2 border border-amber-300/40">
                <div class="w-8 h-8 rounded-xl bg-amber-400/20 flex items-center justify-center text-amber-300 text-lg">
                    <i class="fa-solid fa-bullseye"></i>
                </div>
                <div class="text-left hidden sm:block">
                    <div class="text-xs font-black text-amber-200 uppercase">攻擊蛛絲 [Q]</div>
                    <div class="text-[10px] text-slate-300">擊碎障礙物</div>
                </div>
            </button>

            <button id="btn-electric-web" class="glass-panel px-4 py-3 rounded-2xl bg-cyan-700 active:scale-95 transition-all flex items-center gap-2 border border-cyan-300/40">
                <div class="w-8 h-8 rounded-xl bg-cyan-400/20 flex items-center justify-center text-cyan-300 text-lg">
                    <i class="fa-solid fa-bolt-lightning"></i>
                </div>
                <div class="text-left hidden sm:block">
                    <div class="text-xs font-black text-cyan-200 uppercase">電擊蛛絲 [E]</div>
                    <div class="text-[10px] text-slate-300">防禦與清除前方</div>
                </div>
            </button>

            <button id="mobile-boost-btn" class="glass-panel w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-red-600 active:bg-red-500 border-2 border-red-400 flex items-center justify-center text-white text-xl active:scale-95">
                <i class="fa-solid fa-rocket"></i>
            </button>
        </div>
    </div>

    <!-- Start Modal -->
    <div id="start-modal" class="absolute inset-0 z-30 flex items-center justify-center bg-slate-950/90 p-4">
        <div class="glass-panel max-w-md w-full p-6 sm:p-8 rounded-3xl text-center border border-red-500/30 shadow-2xl relative">
            <div class="w-20 h-20 bg-red-600 rounded-full mx-auto flex items-center justify-center mb-4 border-2 border-white/20">
                <i class="fa-solid fa-spider text-4xl text-white"></i>
            </div>
            
            <h1 class="text-3xl font-black tracking-wide text-white mb-2">蜘蛛俠：高空飛躍</h1>
            <p class="text-slate-300 text-sm mb-5">【已為低端硬體優化】順暢擺盪，擊退綠魔！</p>

            <div class="bg-slate-900 rounded-2xl p-4 mb-6 text-left text-xs space-y-2.5 border border-slate-800">
                <div class="flex items-center gap-3">
                    <span class="bg-slate-800 px-2 py-1 rounded text-cyan-400 font-mono">觸控 / 搖桿</span>
                    <span class="text-slate-300">拖曳左下角搖桿精準控制擺盪方向</span>
                </div>
                <div class="flex items-center gap-3">
                    <span class="bg-amber-500/20 border border-amber-500/40 px-2 py-1 rounded text-amber-300 font-mono">Q 鍵 / 按鈕</span>
                    <span class="text-slate-300">發射<b>攻擊蜘蛛絲</b>擊碎南瓜炸彈</span>
