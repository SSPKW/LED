<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>多位數讀寫大挑戰 (3D 增強版)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Confetti for celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <!-- Import maps for Three.js and Three-Mesh-BVH -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.7.0/build/index.module.js"
      }
    }
  </script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      touch-action: manipulation;
      margin: 0;
      overflow-x: hidden;
    }
    
    /* 3D Canvas fixed in background */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      background: linear-gradient(135deg, #0f172a, #1e293b);
    }

    /* Glassmorphism utilities for UI */
    .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    
    .glass-dark {
      background: rgba(30, 27, 75, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-6 text-slate-800">

  <!-- 3D Background Container -->
  <canvas id="bg-canvas"></canvas>

  <!-- Header -->
  <header class="max-w-2xl mx-auto w-full flex justify-between items-center mb-4 z-10 drop-shadow-md">
    <h1 class="text-2xl font-bold text-white flex items-center gap-2 drop-shadow-lg">
      <span class="text-3xl">🔢</span> 多位數大挑戰
    </h1>
    <div class="flex items-center gap-2 bg-amber-400/90 text-amber-950 px-4 py-1.5 rounded-full text-sm font-extrabold shadow-lg backdrop-blur-md">
      <span>🔥 連對：</span>
      <span id="streak-count" class="text-lg">0</span>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-2xl mx-auto w-full flex-1 flex flex-col gap-4 z-10">

    <!-- Mode Selector & Controls -->
    <div class="glass-panel p-3 rounded-2xl shadow-lg flex flex-wrap gap-2 justify-between items-center">
      <div class="flex gap-1 bg-slate-200/50 p-1 rounded-xl w-full sm:w-auto">
        <button id="mode-all" onclick="window.setMode('all')" class="flex-1 sm:flex-none px-3 py-1.5 text-sm font-bold rounded-lg transition-colors">綜合練習</button>
        <button id="mode-read" onclick="window.setMode('read')" class="flex-1 sm:flex-none px-3 py-1.5 text-sm font-bold rounded-lg transition-colors">看數讀字</button>
        <button id="mode-write" onclick="window.setMode('write')" class="flex-1 sm:flex-none px-3 py-1.5 text-sm font-bold rounded-lg transition-colors">看字寫數</button>
      </div>
      
      <div class="flex gap-2 w-full sm:w-auto justify-end">
        <button onclick="window.toggleHelper()" class="text-xs bg-indigo-100 text-indigo-700 border border-indigo-200 px-3 py-2 rounded-xl font-bold hover:bg-indigo-200 transition-colors flex items-center gap-1 shadow-sm">
          <span>田</span> <span id="helper-btn-text">顯示位值輔助</span>
        </button>
        <button onclick="window.generateQuestion()" class="text-xs bg-slate-700 text-white px-3 py-2 rounded-xl font-bold hover:bg-slate-800 transition-colors shadow-sm">
          ⏩ 跳過
        </button>
      </div>
    </div>

    <!-- Place Value Chart (Helper) -->
    <div id="place-value-chart" class="hidden glass-dark text-white p-3 rounded-2xl shadow-xl text-center text-xs sm:text-sm overflow-x-auto border border-indigo-500/30">
      <div class="grid grid-cols-9 gap-1 min-w-[320px] font-bold">
        <div class="bg-indigo-500/50 p-1 rounded">億</div>
        <div class="bg-blue-500/50 p-1 rounded">千萬</div>
        <div class="bg-blue-500/50 p-1 rounded">百萬</div>
        <div class="bg-blue-500/50 p-1 rounded">十萬</div>
        <div class="bg-blue-500/50 p-1 rounded">萬</div>
        <div class="bg-cyan-500/50 p-1 rounded">千</div>
        <div class="bg-cyan-500/50 p-1 rounded">百</div>
        <div class="bg-cyan-500/50 p-1 rounded">十</div>
        <div class="bg-cyan-500/50 p-1 rounded">個</div>
      </div>
      <div class="grid grid-cols-9 gap-1 min-w-[320px] mt-1 text-[10px] text-indigo-200">
        <div class="col-span-1 bg-indigo-950/60 py-0.5 rounded">億級</div>
        <div class="col-span-4 bg-indigo-950/60 py-0.5 rounded">萬級</div>
        <div class="col-span-4 bg-indigo-950/60 py-0.5 rounded">個級</div>
      </div>
    </div>

    <!-- Question Box -->
    <div class="glass-panel p-6 rounded-3xl shadow-xl text-center flex flex-col items-center justify-center min-h-[160px] relative overflow-hidden">
      <div class="absolute inset-0 bg-gradient-to-br from-white/40 to-transparent pointer-events-none"></div>
      <span id="question-tag" class="absolute top-4 left-4 text-xs font-bold px-3 py-1 rounded-full bg-blue-100 text-blue-700 shadow-sm">看數讀字</span>
      <div id="question-text" class="text-3xl sm:text-5xl font-extrabold text-slate-800 tracking-wider my-2 break-all drop-shadow-sm">
        載入中...
      </div>
    </div>

    <!-- Answer Preview Area -->
    <div class="glass-panel p-4 rounded-2xl border-2 border-blue-400/50 shadow-inner min-h-[72px] flex items-center justify-center text-2xl sm:text-3xl font-bold text-blue-700 break-all transition-all duration-300" id="answer-display">
      <span class="text-slate-400 font-normal text-base">點擊下方鍵盤輸入...</span>
    </div>

    <!-- Interactive Keypads (Touch Optimized) -->
    
    <!-- Keypad A: Chinese Character Buttons (For "Read" Mode) -->
    <div id="keypad-chinese" class="grid grid-cols-5 sm:grid-cols-8 gap-2">
      <!-- Generated by JS -->
    </div>

    <!-- Keypad B: Numeric Buttons (For "Write" Mode) -->
    <div id="keypad-numeric" class="hidden grid-cols-3 sm:grid-cols-5 gap-2">
      <button onclick="window.pressNum('1')" class="glass-panel hover:bg-white border-b-4 border-slate-300 text-slate-800 text-2xl font-bold py-3 rounded-2xl active:translate-y-1 active:border-b-0 transition-all">1</button>
      <button onclick="window.pressNum('2')" class="glass-panel hover:bg-white border-b-4 border-slate-300 text-slate-800 text-2xl font-bold py-3 rounded-2xl active:translate-y-1 active:border-b-0 transition-all">2</button>
      <button onclick="window.pressNum('3')" class="glass-panel hover:bg-white border-b-4 border-slate-300 text-slate-800 text-2xl font-bold py-3 rounded-2xl active:translate-y-1 active:border-b-0 transition-all">3</button>
      <button onclick="window.pressNum('4')" class="glass-panel hover:bg-white border-b-4 border-slate-300 text-slate-800 text-2xl font-bold py-3 rounded-2xl active:translate-y-1 active:border-b-0 transition-all">4</button>
      <button onclick="window.pressNum('5')" class="glass-panel hover:bg-white border-b-4 border-slate-300 text-slate-800 text-2xl font-bold py-3 rounded-2xl active:translate-y-1 active:border-b-0 transition-all">5</button>
      <button onclick="window.pressNum('6')" class="glass-panel hover:bg-white border-b-4 border-slate-300 text-slate-800 text-2xl font-bold py-3 rounded-2xl active:translate-y-1 active:border-b-0 transition-all">6</button>
      <button onclick="window.pressNum('7')" class="glass-panel hover:bg-white border-b-4 border-slate-300 text-slate-800 text-2xl font-bold py-3 rounded-2xl active:translate-y-1 active:border-b-0 transition-all">7</button>
      <button onclick="window.pressNum('8')" class="glass-panel hover:bg-white border-b-4 border-slate-300 text-slate-800 text-2xl font-bold py-3 rounded-2xl active:translate-y-1 active:border-b-0 transition-all">8</button>
      <button onclick="window.pressNum('9')" class="glass-panel hover:bg-white border-b-4 border-slate-300 text-slate-800 text-2xl font-bold py-3 rounded-2xl active:translate-y-1 active:border-b-0 transition-all">9</button>
      <button onclick="window.pressNum('0')" class="glass-panel hover:bg-white border-b-4 border-slate-300 text-slate-800 text-2xl font-bold py-3 rounded-2xl active:translate-y-1 active:border-b-0 transition-all">0</button>
    </div>

    <!-- Control Buttons -->
    <div class="grid grid-cols-3 gap-3 mt-2 pb-6">
      <button onclick="window.clearAnswer()" class="bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold py-3 rounded-2xl active:scale-95 transition-transform text-sm sm:text-base border border-rose-200 shadow-sm">
        🧹 清空
      </button>
      <button onclick="window.deleteChar()" class="bg-amber-100 hover:bg-amber-200 text-amber-700 font-bold py-3 rounded-2xl active:scale-95 transition-transform text-sm sm:text-base border border-amber-200 shadow-sm">
        ⌫ 倒退
      </button>
      <button onclick="window.checkAnswer()" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3 rounded-2xl active:scale-95 transition-transform text-sm sm:text-base shadow-lg border border-blue-500">
        ✅ 檢查答案
      </button>
    </div>

    <!-- Feedback Message Box -->
    <div id="feedback-box" class="hidden p-4 rounded-2xl text-center font-bold text-lg shadow-xl transition-all transform scale-95 border-2 z-20"></div>

  </main>

  <script type="module">
    import * as THREE from 'three';
    import { computeBoundsTree, disposeBoundsTree, acceleratedRaycast } from 'three-mesh-bvh';

    // ----------------------------------------------------
    // UI & Game Logic (Exposed to Global window object)
    // ----------------------------------------------------
    const digitChars = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '零'];
    const unitChars = ['十', '百', '千', '萬', '億'];

    let currentMode = 'all'; 
    let currentType = 'read'; 
    let currentTargetNumber = 0;
    let currentTargetChinese = '';
    let userAnswer = '';
    let streak = 0;

    // Core Number to Chinese Algorithm
    function numberToChinese(num) {
      if (num === 0) return '零';

      const digits = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
      const units = ['', '十', '百', '千'];
      
      let strNum = num.toString();
      
      let yi = Math.floor(num / 100000000);
      let wan = Math.floor((num % 100000000) / 10000);
      let ge = num % 10000;

      function sectionToChinese(section) {
        if (section === 0) return '';
        let str = '';
        let sStr = section.toString().padStart(4, '0');
        let zeroFlag = false;

        for (let i = 0; i < 4; i++) {
          let d = parseInt(sStr[i]);
          if (d !== 0) {
            if (zeroFlag) {
              str += '零';
              zeroFlag = false;
            }
            str += digits[d] + units[3 - i];
          } else {
            if (str.length > 0) {
              zeroFlag = true;
            }
          }
        }
        return str;
      }

      let result = '';

      if (yi > 0) result += sectionToChinese(yi) + '億';

      if (wan > 0) {
        let wanStr = sectionToChinese(wan);
        if (yi > 0 && wan < 1000) result += '零';
        result += wanStr + '萬';
      } else if (yi > 0 && ge > 0) {
        result += '零';
      }

      if (ge > 0) {
        let geStr = sectionToChinese(ge);
        if ((wan > 0 || yi > 0) && ge < 1000) {
          if (!result.endsWith('零')) result += '零';
        }
        result += geStr;
      }

      result = result.replace(/零+/g, '零').replace(/零$/, '');
      result = result.replace(/^一十/, '十');
      result = result.replace(/億一十/g, '億十');
      result = result.replace(/萬一十/g, '萬十');

      return result;
    }

    window.initChineseKeypad = function() {
      const keypad = document.getElementById('keypad-chinese');
      keypad.innerHTML = '';
      
      const allBtns = [...digitChars, ...unitChars];
      allBtns.forEach(char => {
        const btn = document.createElement('button');
        btn.innerText = char;
        btn.className = "glass-panel hover:bg-white border-b-4 border-slate-300 text-slate-800 text-xl sm:text-2xl font-bold py-3 rounded-2xl active:translate-y-1 active:border-b-0 transition-all";
        btn.onclick = () => window.pressChar(char);
        keypad.appendChild(btn);
      });
    }

    window.setMode = function(mode) {
      currentMode = mode;
      ['all', 'read', 'write'].forEach(m => {
        const btn = document.getElementById(`mode-${m}`);
        if (m === mode) {
          btn.className = "flex-1 sm:flex-none px-4 py-2 text-sm font-bold rounded-xl transition-all bg-white text-blue-600 shadow-md scale-105";
        } else {
          btn.className = "flex-1 sm:flex-none px-3 py-1.5 text-sm font-bold rounded-lg transition-colors text-slate-600 hover:text-slate-900";
        }
      });
      window.generateQuestion();
    }

    window.toggleHelper = function() {
      const chart = document.getElementById('place-value-chart');
      const text = document.getElementById('helper-btn-text');
      if (chart.classList.contains('hidden')) {
        chart.classList.remove('hidden');
        text.innerText = "隱藏位值輔助";
      } else {
        chart.classList.add('hidden');
        text.innerText = "顯示位值輔助";
      }
    }

    window.generateQuestion = function() {
      window.clearAnswer();
      window.hideFeedback();

      if (currentMode === 'all') {
        currentType = Math.random() < 0.5 ? 'read' : 'write';
      } else {
        currentType = currentMode;
      }

      const ranges = [
        [10000, 99999],         
        [100000, 999999],       
        [1000000, 9999999],     
        [10000000, 99999999],   
        [100000000, 999999999]  
      ];
      
      const selectedRange = ranges[Math.floor(Math.random() * ranges.length)];
      currentTargetNumber = Math.floor(Math.random() * (selectedRange[1] - selectedRange[0] + 1)) + selectedRange[0];
      currentTargetChinese = numberToChinese(currentTargetNumber);

      const qTag = document.getElementById('question-tag');
      const qText = document.getElementById('question-text');
      const keypadChinese = document.getElementById('keypad-chinese');
      const keypadNumeric = document.getElementById('keypad-numeric');

      if (currentType === 'read') {
        qTag.innerText = "看數讀字";
        qTag.className = "absolute top-4 left-4 text-xs font-bold px-3 py-1 rounded-full bg-blue-100 text-blue-700 shadow-sm";
        qText.innerText = currentTargetNumber.toString();
        
        keypadChinese.classList.remove('hidden');
        keypadChinese.classList.add('grid');
        keypadNumeric.classList.add('hidden');
        keypadNumeric.classList.remove('grid');
      } else {
        qTag.innerText = "看字寫數";
        qTag.className = "absolute top-4 left-4 text-xs font-bold px-3 py-1 rounded-full bg-purple-100 text-purple-700 shadow-sm";
        qText.innerText = currentTargetChinese;

        keypadChinese.classList.add('hidden');
        keypadChinese.classList.remove('grid');
        keypadNumeric.classList.remove('hidden');
        keypadNumeric.classList.add('grid');
      }
      
      // Reset 3D mesh visual state
      if(window.reset3DMeshColor) window.reset3DMeshColor();
    }

    window.pressChar = function(char) {
      userAnswer += char;
      window.updateDisplay();
    }

    window.pressNum = function(num) {
      if (userAnswer.length >= 9) return; 
      userAnswer += num;
      window.updateDisplay();
    }

    window.deleteChar = function() {
      userAnswer = userAnswer.slice(0, -1);
      window.updateDisplay();
    }

    window.clearAnswer = function() {
      userAnswer = '';
      window.updateDisplay();
    }

    window.updateDisplay = function() {
      const display = document.getElementById('answer-display');
      if (userAnswer === '') {
        display.innerHTML = `<span class="text-slate-400 font-normal text-base">請點擊下方鍵盤輸入答案...</span>`;
      } else {
        display.innerText = userAnswer;
      }
    }

    window.checkAnswer = function() {
      if (!userAnswer) return;

      const isCorrect = currentType === 'read' 
        ? userAnswer === currentTargetChinese 
        : userAnswer === currentTargetNumber.toString();

      if (isCorrect) {
        streak++;
        document.getElementById('streak-count').innerText = streak;
        window.showFeedback(true, "🎉 太棒了！答對了！");
        confetti({ particleCount: 80, spread: 70, origin: { y: 0.8 }, colors: ['#4f46e5', '#3b82f6', '#fbbf24'] });
        
        // Trigger 3D Celebration
        if(window.celebrate3D) window.celebrate3D();

        setTimeout(window.generateQuestion, 2000);
      } else {
        streak = 0;
        document.getElementById('streak-count').innerText = streak;
        
        const correctStr = currentType === 'read' ? currentTargetChinese : currentTargetNumber.toString();
        window.showFeedback(false, `❌ 再想想看！正確答案是：${correctStr}`);
        
        // Trigger 3D Error
        if(window.error3D) window.error3D();
      }
    }

    window.showFeedback = function(isSuccess, message) {
      const box = document.getElementById('feedback-box');
      box.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800', 'border-emerald-300', 'bg-rose-100', 'text-rose-800', 'border-rose-300', 'scale-95');
      box.classList.add('scale-100');
      
      if (isSuccess) {
        box.classList.add('bg-emerald-100', 'text-emerald-800', 'border-emerald-300');
      } else {
        box.classList.add('bg-rose-100', 'text-rose-800', 'border-rose-300');
      }
      
      box.innerText = message;
    }

    window.hideFeedback = function() {
      const box = document.getElementById('feedback-box');
      box.classList.add('hidden', 'scale-95');
      box.classList.remove('scale-100');
    }

    // ----------------------------------------------------
    // Three.js & Three-Mesh-BVH Setup
    // ----------------------------------------------------
    THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
    THREE.BufferGeometry.prototype.disposeBoundsTree = disposeBoundsTree;
    THREE.Mesh.prototype.raycast = acceleratedRaycast;

    let scene, camera, renderer;
    let complexMesh, highlightMesh;
    let raycaster, mouse;
    let targetRotationX = 0;
    let targetRotationY = 0;
    let celebrationMode = false;
    let errorMode = false;

    function initThreeJS() {
      const canvas = document.getElementById('bg-canvas');
      
      scene = new THREE.Scene();
      
      // Setup Camera
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 50;

      // Setup Renderer
      renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);

      // We use a highly segmented TorusKnot to create a lot of faces (approx 60,000 faces)
      // Without BVH, raycasting this every frame would lag.
      const geometry = new THREE.TorusKnotGeometry(18, 4, 300, 100);
      
      // COMPUTE BVH BOUNDS TREE
      console.time('BVH Compute');
      geometry.computeBoundsTree();
      console.timeEnd('BVH Compute');

      // Material for the complex mesh
      const material = new THREE.MeshStandardMaterial({ 
        color: 0x3b82f6, 
        wireframe: true,
        transparent: true,
        opacity: 0.15
      });

      complexMesh = new THREE.Mesh(geometry, material);
      scene.add(complexMesh);

      // Highlight Mesh (cursor on intersection)
      const highlightGeo = new THREE.SphereGeometry(0.8, 16, 16);
      const highlightMat = new THREE.MeshBasicMaterial({ 
        color: 0x22d3ee, 
        transparent: true, 
        opacity: 0.8 
      });
      highlightMesh = new THREE.Mesh(highlightGeo, highlightMat);
      highlightMesh.visible = false;
      scene.add(highlightMesh);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);

      const pointLight = new THREE.PointLight(0xffffff, 1000);
      pointLight.position.set(20, 20, 20);
      scene.add(pointLight);

      const pointLight2 = new THREE.PointLight(0x4f46e5, 1000);
      pointLight2.position.set(-20, -20, 20);
      scene.add(pointLight2);

      // Raycaster setup
      raycaster = new THREE.Raycaster();
      raycaster.firstHitOnly = true; // Optimization provided by BVH
      mouse = new THREE.Vector2();

      // Event Listeners for Interaction & Resize
      window.addEventListener('resize', onWindowResize);
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('touchmove', onTouchMove, { passive: true });

      // Start Animation Loop
      animate();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function updateMouse(clientX, clientY) {
      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;
      
      // Add slight rotation based on mouse position
      targetRotationX = mouse.y * 0.5;
      targetRotationY = mouse.x * 0.5;
    }

    function onMouseMove(event) {
      updateMouse(event.clientX, event.clientY);
    }

    function onTouchMove(event) {
      if (event.touches.length > 0) {
        updateMouse(event.touches[0].clientX, event.touches[0].clientY);
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      // Gentle auto-rotation
      if (!celebrationMode && !errorMode) {
        complexMesh.rotation.x += 0.001;
        complexMesh.rotation.y += 0.002;
        
        // Interpolate rotation towards mouse
        complexMesh.rotation.x += (targetRotationX - complexMesh.rotation.x) * 0.05;
        complexMesh.rotation.y += (targetRotationY - complexMesh.rotation.y) * 0.05;
      } else if (celebrationMode) {
        // Fast spin for celebration
        complexMesh.rotation.y += 0.1;
        complexMesh.rotation.z += 0.05;
      } else if (errorMode) {
        // Shake for error
        complexMesh.position.x = (Math.random() - 0.5) * 2;
        complexMesh.position.y = (Math.random() - 0.5) * 2;
      }

      // Perform BVH Raycasting
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(complexMesh);

      if (intersects.length > 0) {
        highlightMesh.visible = true;
        highlightMesh.position.copy(intersects[0].point);
        
        // Pulse highlight size
        const scale = 1 + Math.sin(Date.now() * 0.01) * 0.2;
        highlightMesh.scale.set(scale, scale, scale);
      } else {
        highlightMesh.visible = false;
      }

      renderer.render(scene, camera);
    }

    window.celebrate3D = function() {
      celebrationMode = true;
      if (complexMesh && complexMesh.material) {
        complexMesh.material.color.setHex(0x10b981); // Emerald green
        complexMesh.material.opacity = 0.4;
      }
      setTimeout(() => {
        celebrationMode = false;
        window.reset3DMeshColor();
      }, 1500);
    }

    window.error3D = function() {
      errorMode = true;
      if (complexMesh && complexMesh.material) {
        complexMesh.material.color.setHex(0xf43f5e); // Rose red
        complexMesh.material.opacity = 0.5;
      }
      setTimeout(() => {
        errorMode = false;
        if (complexMesh) complexMesh.position.set(0,0,0);
        window.reset3DMeshColor();
      }, 500);
    }

    window.reset3DMeshColor = function() {
      if(!celebrationMode && !errorMode && complexMesh && complexMesh.material) {
        complexMesh.material.color.setHex(0x3b82f6); // Default Blue
        complexMesh.material.opacity = 0.15;
      }
    }

    // Initialize both 2D Logic and 3D Scene
    window.onload = () => {
      window.initChineseKeypad();
      initThreeJS(); // Initialize 3D scene FIRST to prevent undefined mesh errors
      window.setMode('all'); // THEN trigger game logic
    };

  </script>
</body>
</html>
