<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多位數讀寫大挑戰（億位以內）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between p-4 md:p-6 text-slate-800">

  <!-- Header -->
  <header class="max-w-2xl mx-auto w-full flex justify-between items-center mb-4">
    <h1 class="text-2xl font-bold text-blue-600 flex items-center gap-2">
      <span>🔢</span> 多位數讀寫大挑戰
    </h1>
    <div class="flex items-center gap-2 bg-amber-100 text-amber-800 px-3 py-1 rounded-full text-sm font-bold">
      <span>🔥 連對：</span>
      <span id="streak-count">0</span>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-2xl mx-auto w-full flex-1 flex flex-col gap-4">

    <!-- Mode Selector & Controls -->
    <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap gap-2 justify-between items-center">
      <div class="flex gap-1 bg-slate-100 p-1 rounded-xl w-full sm:w-auto">
        <button id="mode-all" onclick="setMode('all')" class="flex-1 sm:flex-none px-3 py-1.5 text-sm font-bold rounded-lg transition-colors">綜合練習</button>
        <button id="mode-read" onclick="setMode('read')" class="flex-1 sm:flex-none px-3 py-1.5 text-sm font-bold rounded-lg transition-colors">看數讀字</button>
        <button id="mode-write" onclick="setMode('write')" class="flex-1 sm:flex-none px-3 py-1.5 text-sm font-bold rounded-lg transition-colors">看字寫數</button>
      </div>
      
      <div class="flex gap-2 w-full sm:w-auto justify-end">
        <button onclick="toggleHelper()" class="text-xs bg-indigo-50 text-indigo-600 border border-indigo-200 px-3 py-2 rounded-xl font-bold hover:bg-indigo-100 transition-colors flex items-center gap-1">
          <span>田</span> <span id="helper-btn-text">顯示位值輔助</span>
        </button>
        <button onclick="generateQuestion()" class="text-xs bg-slate-100 text-slate-600 px-3 py-2 rounded-xl font-bold hover:bg-slate-200 transition-colors">
          ⏩ 跳過
        </button>
      </div>
    </div>

    <!-- Place Value Chart (Helper) -->
    <div id="place-value-chart" class="hidden bg-indigo-900 text-white p-3 rounded-2xl shadow-md text-center text-xs sm:text-sm overflow-x-auto">
      <div class="grid grid-cols-9 gap-1 min-w-[320px] font-bold">
        <div class="bg-indigo-800/80 p-1 rounded">億</div>
        <div class="bg-indigo-700/80 p-1 rounded">千萬</div>
        <div class="bg-indigo-700/80 p-1 rounded">百萬</div>
        <div class="bg-indigo-700/80 p-1 rounded">十萬</div>
        <div class="bg-indigo-700/80 p-1 rounded">萬</div>
        <div class="bg-indigo-600/80 p-1 rounded">千</div>
        <div class="bg-indigo-600/80 p-1 rounded">百</div>
        <div class="bg-indigo-600/80 p-1 rounded">十</div>
        <div class="bg-indigo-600/80 p-1 rounded">個</div>
      </div>
      <div class="grid grid-cols-3 gap-1 min-w-[320px] mt-1 text-[10px] text-indigo-200">
        <div class="bg-indigo-950/40 py-0.5 rounded">億級</div>
        <div class="bg-indigo-950/40 py-0.5 rounded">萬級</div>
        <div class="bg-indigo-950/40 py-0.5 rounded">個級</div>
      </div>
    </div>

    <!-- Question Box -->
    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 text-center flex flex-col items-center justify-center min-h-[160px] relative">
      <span id="question-tag" class="absolute top-4 left-4 text-xs font-bold px-2.5 py-1 rounded-full bg-blue-50 text-blue-600">看數讀字</span>
      <div id="question-text" class="text-2xl sm:text-4xl font-extrabold text-slate-800 tracking-wider my-2 break-all">
        載入中...
      </div>
    </div>

    <!-- Answer Preview Area -->
    <div class="bg-white p-4 rounded-2xl border-2 border-blue-200 shadow-sm min-h-[64px] flex items-center justify-center text-xl sm:text-2xl font-bold text-blue-700 break-all" id="answer-display">
      <span class="text-slate-300 font-normal text-base">點擊下方鍵盤輸入...</span>
    </div>

    <!-- Interactive Keypads (Touch Optimized) -->
    
    <!-- Keypad A: Chinese Character Buttons (For "Read" Mode) -->
    <div id="keypad-chinese" class="grid grid-cols-5 sm:grid-cols-8 gap-2">
      <!-- Generated by JS -->
    </div>

    <!-- Keypad B: Numeric Buttons (For "Write" Mode) -->
    <div id="keypad-numeric" class="hidden grid-cols-3 sm:grid-cols-5 gap-2">
      <button onclick="pressNum('1')" class="bg-white hover:bg-slate-50 border-2 border-slate-200 text-slate-800 text-2xl font-bold py-3 rounded-2xl active:scale-95 transition-transform shadow-sm">1</button>
      <button onclick="pressNum('2')" class="bg-white hover:bg-slate-50 border-2 border-slate-200 text-slate-800 text-2xl font-bold py-3 rounded-2xl active:scale-95 transition-transform shadow-sm">2</button>
      <button onclick="pressNum('3')" class="bg-white hover:bg-slate-50 border-2 border-slate-200 text-slate-800 text-2xl font-bold py-3 rounded-2xl active:scale-95 transition-transform shadow-sm">3</button>
      <button onclick="pressNum('4')" class="bg-white hover:bg-slate-50 border-2 border-slate-200 text-slate-800 text-2xl font-bold py-3 rounded-2xl active:scale-95 transition-transform shadow-sm">4</button>
      <button onclick="pressNum('5')" class="bg-white hover:bg-slate-50 border-2 border-slate-200 text-slate-800 text-2xl font-bold py-3 rounded-2xl active:scale-95 transition-transform shadow-sm">5</button>
      <button onclick="pressNum('6')" class="bg-white hover:bg-slate-50 border-2 border-slate-200 text-slate-800 text-2xl font-bold py-3 rounded-2xl active:scale-95 transition-transform shadow-sm">6</button>
      <button onclick="pressNum('7')" class="bg-white hover:bg-slate-50 border-2 border-slate-200 text-slate-800 text-2xl font-bold py-3 rounded-2xl active:scale-95 transition-transform shadow-sm">7</button>
      <button onclick="pressNum('8')" class="bg-white hover:bg-slate-50 border-2 border-slate-200 text-slate-800 text-2xl font-bold py-3 rounded-2xl active:scale-95 transition-transform shadow-sm">8</button>
      <button onclick="pressNum('9')" class="bg-white hover:bg-slate-50 border-2 border-slate-200 text-slate-800 text-2xl font-bold py-3 rounded-2xl active:scale-95 transition-transform shadow-sm">9</button>
      <button onclick="pressNum('0')" class="bg-white hover:bg-slate-50 border-2 border-slate-200 text-slate-800 text-2xl font-bold py-3 rounded-2xl active:scale-95 transition-transform shadow-sm">0</button>
    </div>

    <!-- Control Buttons (Clear, Delete, Submit) -->
    <div class="grid grid-cols-3 gap-2 mt-1">
      <button onclick="clearAnswer()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 rounded-2xl active:scale-95 transition-transform text-sm sm:text-base">
        🧹 清空
      </button>
      <button onclick="deleteChar()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 rounded-2xl active:scale-95 transition-transform text-sm sm:text-base">
        ⌫ 倒退
      </button>
      <button onclick="checkAnswer()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-2xl active:scale-95 transition-transform text-sm sm:text-base shadow-md">
        ✅ 檢查答案
      </button>
    </div>

    <!-- Feedback Message Box -->
    <div id="feedback-box" class="hidden p-4 rounded-2xl text-center font-bold text-base transition-all"></div>

  </main>

  <script>
    const digitChars = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '零'];
    const unitChars = ['十', '百', '千', '萬', '億'];

    let currentMode = 'all'; // 'all', 'read', 'write'
    let currentType = 'read'; // 'read' (number to text) or 'write' (text to number)
    let currentTargetNumber = 0;
    let currentTargetChinese = '';
    let userAnswer = '';
    let streak = 0;

    // --- 數字轉中文讀法核心演算法 (修復習慣讀法修正：如十五萬非一十五萬) ---
    function numberToChinese(num) {
      if (num === 0) return '零';

      const digits = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
      const units = ['', '十', '百', '千'];
      
      let strNum = num.toString();
      let len = strNum.length;
      
      // 分組：個級, 萬級, 億級
      let yi = Math.floor(num / 100000000);
      let wan = Math.floor((num % 100000000) / 10000);
      let ge = num % 10000;

      function sectionToChinese(section) {
        if (section === 0) return '';
        let str = '';
        let sStr = section.toString().padStart(4, '0');
        let zeroFlag = false;

        for (let i = 0; i < 4; i++) {
          let d = parseInt(sStr[i]);
          if (d !== 0) {
            if (zeroFlag) {
              str += '零';
              zeroFlag = false;
            }
            str += digits[d] + units[3 - i];
          } else {
            if (str.length > 0) {
              zeroFlag = true;
            }
          }
        }
        return str;
      }

      let result = '';

      // 億級
      if (yi > 0) {
        result += sectionToChinese(yi) + '億';
      }

      // 萬級
      if (wan > 0) {
        let wanStr = sectionToChinese(wan);
        if (yi > 0 && wan < 1000) {
          result += '零';
        }
        result += wanStr + '萬';
      } else if (yi > 0 && ge > 0) {
        result += '零';
      }

      // 個級
      if (ge > 0) {
        let geStr = sectionToChinese(ge);
        if ((wan > 0 || yi > 0) && ge < 1000) {
          if (!result.endsWith('零')) {
            result += '零';
          }
        }
        result += geStr;
      }

      // 清理多餘的零
      result = result.replace(/零+/g, '零').replace(/零$/, '');

      // 修正習慣讀法：如「一十五萬」改為「十五萬」、「一十」改為「十」
      // 規則：在開頭或是「億」、「萬」後面的「一十」換成「十」
      result = result.replace(/^一十/, '十');
      result = result.replace(/億一十/g, '億十');
      result = result.replace(/萬一十/g, '萬十');

      return result;
    }

    // 初始化中文按鈕
    function initChineseKeypad() {
      const keypad = document.getElementById('keypad-chinese');
      keypad.innerHTML = '';
      
      const allBtns = [...digitChars, ...unitChars];
      allBtns.forEach(char => {
        const btn = document.createElement('button');
        btn.innerText = char;
        btn.className = "bg-white hover:bg-slate-50 border-2 border-slate-200 text-slate-800 text-xl font-bold py-3 rounded-2xl active:scale-95 transition-transform shadow-sm";
        btn.onclick = () => pressChar(char);
        keypad.appendChild(btn);
      });
    }

    // 模式切換
    function setMode(mode) {
      currentMode = mode;
      ['all', 'read', 'write'].forEach(m => {
        const btn = document.getElementById(`mode-${m}`);
        if (m === mode) {
          btn.className = "flex-1 sm:flex-none px-3 py-1.5 text-sm font-bold rounded-lg transition-colors bg-white text-blue-600 shadow-sm";
        } else {
          btn.className = "flex-1 sm:flex-none px-3 py-1.5 text-sm font-bold rounded-lg transition-colors text-slate-600 hover:text-slate-900";
        }
      });
      generateQuestion();
    }

    // 開關位值表
    function toggleHelper() {
      const chart = document.getElementById('place-value-chart');
      const text = document.getElementById('helper-btn-text');
      if (chart.classList.contains('hidden')) {
        chart.classList.remove('hidden');
        text.innerText = "隱藏位值輔助";
      } else {
        chart.classList.add('hidden');
        text.innerText = "顯示位值輔助";
      }
    }

    // 生成新題目
    function generateQuestion() {
      clearAnswer();
      hideFeedback();

      // 決定題目類型
      if (currentMode === 'all') {
        currentType = Math.random() < 0.5 ? 'read' : 'write';
      } else {
        currentType = currentMode;
      }

      // 隨機生成 10,000 ~ 999,999,999 的數字 (萬位至億位)
      const ranges = [
        [10000, 99999],         // 萬
        [100000, 999999],       // 十萬
        [1000000, 9999999],     // 百萬
        [10000000, 99999999],   // 千萬
        [100000000, 999999999]  // 億
      ];
      
      const selectedRange = ranges[Math.floor(Math.random() * ranges.length)];
      currentTargetNumber = Math.floor(Math.random() * (selectedRange[1] - selectedRange[0] + 1)) + selectedRange[0];
      currentTargetChinese = numberToChinese(currentTargetNumber);

      const qTag = document.getElementById('question-tag');
      const qText = document.getElementById('question-text');
      const keypadChinese = document.getElementById('keypad-chinese');
      const keypadNumeric = document.getElementById('keypad-numeric');

      if (currentType === 'read') {
        qTag.innerText = "看數讀字";
        qTag.className = "absolute top-4 left-4 text-xs font-bold px-2.5 py-1 rounded-full bg-blue-50 text-blue-600";
        // 依要求：無逗號隔位顯示
        qText.innerText = currentTargetNumber.toString();
        
        keypadChinese.classList.remove('hidden');
        keypadChinese.classList.add('grid');
        keypadNumeric.classList.add('hidden');
        keypadNumeric.classList.remove('grid');
      } else {
        qTag.innerText = "看字寫數";
        qTag.className = "absolute top-4 left-4 text-xs font-bold px-2.5 py-1 rounded-full bg-purple-50 text-purple-600";
        qText.innerText = currentTargetChinese;

        keypadChinese.classList.add('hidden');
        keypadChinese.classList.remove('grid');
        keypadNumeric.classList.remove('hidden');
        keypadNumeric.classList.add('grid');
      }
    }

    // 按鍵操作
    function pressChar(char) {
      userAnswer += char;
      updateDisplay();
    }

    function pressNum(num) {
      if (userAnswer.length >= 9) return; // 億位最多 9 位數
      userAnswer += num;
      updateDisplay();
    }

    function deleteChar() {
      userAnswer = userAnswer.slice(0, -1);
      updateDisplay();
    }

    function clearAnswer() {
      userAnswer = '';
      updateDisplay();
    }

    function updateDisplay() {
      const display = document.getElementById('answer-display');
      if (userAnswer === '') {
        display.innerHTML = `<span class="text-slate-300 font-normal text-base">請點擊下方鍵盤輸入答案...</span>`;
      } else {
        display.innerText = userAnswer;
      }
    }

    // 檢查答案
    function checkAnswer() {
      if (!userAnswer) return;

      const isCorrect = currentType === 'read' 
        ? userAnswer === currentTargetChinese 
        : userAnswer === currentTargetNumber.toString();

      if (isCorrect) {
        streak++;
        document.getElementById('streak-count').innerText = streak;
        showFeedback(true, "🎉 太棒了！答對了！");
        confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 } });
        setTimeout(generateQuestion, 1500);
      } else {
        streak = 0;
        document.getElementById('streak-count').innerText = streak;
        
        const correctStr = currentType === 'read' ? currentTargetChinese : currentTargetNumber.toString();
        showFeedback(false, `❌ 再想想看！正確答案是：${correctStr}`);
      }
    }

    function showFeedback(isSuccess, message) {
      const box = document.getElementById('feedback-box');
      box.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800', 'bg-rose-100', 'text-rose-800');
      
      if (isSuccess) {
        box.classList.add('bg-emerald-100', 'text-emerald-800');
      } else {
        box.classList.add('bg-rose-100', 'text-rose-800');
      }
      
      box.innerText = message;
    }

    function hideFeedback() {
      const box = document.getElementById('feedback-box');
      box.classList.add('hidden');
    }

    // 初始化頁面
    window.onload = () => {
      initChineseKeypad();
      setMode('all');
    };
  </script>
</body>
</html>
